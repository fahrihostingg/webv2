<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Banned - Pahri v1.7.1</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .banned-container {
            max-width: 600px;
            width: 100%;
        }
        .banned-card {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            text-align: center;
            animation: shakeIn 0.6s ease;
            border: 4px solid var(--error);
            margin-bottom: 20px;
        }
        @keyframes shakeIn {
            0% { opacity: 0; transform: translateX(-100px); }
            50% { transform: translateX(10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .banned-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .banned-reason {
            background: #fef2f2;
            border-left: 4px solid var(--error);
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
        }
        html.dark-mode .banned-reason {
            background: #7f1d1d;
            color: #fecaca;
        }
        .appeal-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            border: 2px solid var(--warning);
        }
    </style>
</head>
<body>
    <div class="banned-container">
        <div class="banned-card">
            <div class="banned-icon">🚫</div>
            <h1 style="font-size: 28px; margin-bottom: 15px; color: var(--error);">Account Banned</h1>
            <p style="color: var(--text-light); margin-bottom: 10px; font-size: 16px;">
                Akaun kau telah disekat oleh admin
            </p>
            
            <div class="banned-reason">
                <strong style="color: var(--error);">📋 Reason:</strong>
                <p id="banReason" style="margin: 8px 0 0 0; font-size: 14px;">Loading...</p>
            </div>

            <div style="background: var(--bg); padding: 16px; border-radius: 8px; margin: 20px 0;">
                <p style="margin: 0; font-size: 13px; color: var(--text-light);">
                    <strong>Banned at:</strong> <span id="bannedAt">-</span><br>
                    <strong>Banned by:</strong> <span id="bannedBy">-</span><br>
                    <strong>Your Email:</strong> <span id="userEmail">-</span>
                </p>
            </div>

            <button class="btn-primary" onclick="logout()" style="width: 100%;">
                🚪 Logout
            </button>
        </div>

        <div class="appeal-card">
            <h3 style="margin-bottom: 15px;">📝 Appeal Ban</h3>
            <p style="color: var(--text-light); font-size: 14px; margin-bottom: 20px;">
                Kalau rasa ban ni salah, hantar appeal kat admin. Admin akan review.
            </p>
            
            <div id="appealStatus"></div>
            
            <form id="appealForm" style="text-align: left;">
                <div class="form-group">
                    <label>Reason Kenapa Patut Unban</label>
                    <textarea id="appealReason" rows="4" placeholder="Explain kenapa ban ni tak patut..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Contact Email</label>
                    <input type="email" id="appealEmail" placeholder="Email untuk admin reply" required>
                </div>
                <button type="submit" class="btn-primary" id="appealBtn" style="width: 100%;">
                    <span id="appealText">📤 Hantar Appeal</span>
                    <span id="appealLoading" style="display:none;">⏳ Sending...</span>
                </button>
            </form>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.7.1
    </div>

    <div id="toastContainer"></div>

    <script>
        let currentUser = null;
        let hasExistingAppeal = false;

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (!session) {
                window.location.replace('/login');
                return;
            }

            const { data: profile } = await supabaseClient
            .from('profiles')
            .select('*, banned_by:profiles!banned_by(full_name, email)')
            .eq('id', session.user.id)
            .single();

            if (!profile) {
                window.location.replace('/login');
                return;
            }

            // Kalau tak kena ban, redirect keluar
            if (!profile.is_banned) {
                window.location.replace('/dashboard');
                return;
            }

            currentUser = profile;

            // Display ban info
            document.getElementById('banReason').textContent = profile.banned_reason || 'No reason provided';
            document.getElementById('bannedAt').textContent = profile.banned_at 
                ? new Date(profile.banned_at).toLocaleString('id-ID') 
                : 'Unknown';
            document.getElementById('bannedBy').textContent = profile.banned_by?.full_name || profile.banned_by?.email || 'System';
            document.getElementById('userEmail').textContent = profile.email;
            document.getElementById('appealEmail').value = profile.email;

            // Check kalau dah ada appeal pending
            await checkExistingAppeal();
        })();

        async function checkExistingAppeal() {
            const { data } = await supabaseClient
            .from('ban_appeals')
            .select('*')
            .eq('user_id', currentUser.id)
            .eq('status', 'pending')
            .single();

            const statusDiv = document.getElementById('appealStatus');
            const form = document.getElementById('appealForm');

            if (data) {
                hasExistingAppeal = true;
                statusDiv.innerHTML = `
                    <div style="background: #fffbf0; border-left: 4px solid var(--warning); padding: 16px; border-radius: 8px; margin-bottom: 20px;">
                        <strong style="color: var(--warning);">⏳ Appeal Pending</strong>
                        <p style="margin: 8px 0 0 0; font-size: 13px; color: var(--text-light);">
                            Kau dah submit appeal pada ${new Date(data.created_at).toLocaleString('id-ID')}. 
                            Tunggu admin review.
                        </p>
                    </div>
                `;
                form.style.display = 'none';
            }
        }

        document.getElementById('appealForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (hasExistingAppeal) {
                showToast('Kau dah ada appeal pending!', 'warning');
                return;
            }

            const reason = document.getElementById('appealReason').value.trim();
            const email = document.getElementById('appealEmail').value.trim();

            if (!reason || !email) {
                showToast('Isi semua field!', 'error');
                return;
            }

            document.getElementById('appealText').style.display = 'none';
            document.getElementById('appealLoading').style.display = 'inline';
            document.getElementById('appealBtn').disabled = true;

            const { error } = await supabaseClient
            .from('ban_appeals')
            .insert({
                user_id: currentUser.id,
                email: email,
                reason: reason,
                ban_reason: currentUser.banned_reason,
                status: 'pending'
            });

            if (error) {
                showToast('Error: ' + error.message, 'error');
                document.getElementById('appealText').style.display = 'inline';
                document.getElementById('appealLoading').style.display = 'none';
                document.getElementById('appealBtn').disabled = false;
            } else {
                showToast('✅ Appeal berjaya dihantar! Admin akan review.', 'success');
                document.getElementById('appealForm').reset();
                await checkExistingAppeal();
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            showToast('Logged out', 'info');
            setTimeout(() => window.location.replace('/login'), 1000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.style.cssText = 'position:fixed;top:20px;right:20px;background:var(--card-bg);padding:16px 20px;border-radius:10px;box-shadow:var(--shadow-xl);z-index:9999;display:flex;align-items:center;gap:12px;';
            toast.innerHTML = `<span style="font-size:20px;">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
