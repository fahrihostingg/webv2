<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Pahri v1.7.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .maintenance-card {
            background: var(--card-bg);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: var(--shadow-xl);
            text-align: center;
            max-width: 500px;
            animation: bounceIn 0.6s ease;
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1); }
        }
        .maintenance-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="maintenance-card">
        <div class="maintenance-icon">🔧</div>
        <h1 style="font-size: 28px; margin-bottom: 15px;">Website Maintenance</h1>
        <p style="color: var(--text-light); margin-bottom: 30px; font-size: 16px;" id="maintenanceMsg">
            Server sedang upgrade. Sila cuba lagi nanti.
        </p>
        <div id="devBypass" style="display:none;">
            <button class="btn-primary" onclick="window.location.href='/dashboard'">
                💻 Dev Bypass - Enter Dashboard
            </button>
        </div>
        <button class="btn-secondary" onclick="checkStatus()" style="margin-top: 15px;">
            🔄 Check Status
        </button>
    </div>

    <script>
        (async () => {
            // Check maintenance status
            const { data: settings } = await supabaseClient
             .from('system_settings')
             .select('maintenance_mode, maintenance_message')
             .eq('id', 1)
             .single();

            if (settings && settings.maintenance_message) {
                document.getElementById('maintenanceMsg').textContent = settings.maintenance_message;
            }

            // Check kalau user DEV, kasi bypass
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: profile } = await supabaseClient
                 .from('profiles')
                 .select('role')
                 .eq('id', session.user.id)
                 .single();

                if (profile && profile.role === 'dev') {
                    document.getElementById('devBypass').style.display = 'block';
                }
            }

            // Kalau maintenance OFF, redirect keluar
            if (settings &&!settings.maintenance_mode) {
                window.location.replace('/dashboard');
            }
        })();

        async function checkStatus() {
            const { data: settings } = await supabaseClient
             .from('system_settings')
             .select('maintenance_mode')
             .eq('id', 1)
             .single();

            if (settings &&!settings.maintenance_mode) {
                showToast('Maintenance selesai! Redirecting...', 'success');
                setTimeout(() => window.location.replace('/dashboard'), 1500);
            } else {
                showToast('Masih maintenance...', 'warning');
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer') || document.body;
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.style.cssText = 'position:fixed;top:20px;right:20px;background:var(--card-bg);padding:16px 20px;border-radius:10px;box-shadow:var(--shadow-xl);z-index:9999;display:flex;align-items:center;gap:12px;';
            toast.innerHTML = `<span style="font-size:20px;">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
