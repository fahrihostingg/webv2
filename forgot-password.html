<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Pahri v1.5.10</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 32px; margin: 0;">⚡ Pahri</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.7; font-size: 12px;">Platform v1.5.10</p>
            </div>

            <h2 style="font-size: 20px;">🔑 Lupa Password</h2>
            <p style="font-size: 13px;">Masukkan email, kami hantar link reset</p>

            <div id="message" class="message" style="display:none;"></div>

            <form id="forgotForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">
                    <span id="btnText">Hantar Link Reset</span>
                    <span id="btnLoading" style="display:none;">⏳ Menghantar...</span>
                </button>
            </form>

            <div class="auth-link">
                Ingat password? <a href="/login">Login sini</a>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.5.10
    </div>

    <div id="toastContainer"></div>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const submitBtn = document.getElementById('submitBtn');

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            submitBtn.disabled = true;

            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/update-password'
            });

            if (error) {
                console.error('Reset error:', error);
                showMessage('Error: ' + error.message, 'error');
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                submitBtn.disabled = false;
                return;
            }

            showToast('✅ Link reset dah hantar! Check email kau.', 'success');
            showMessage('Check inbox/spam folder untuk link reset password.', 'success');
            
            setTimeout(() => {
                window.location.replace('/login');
            }, 3000);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };

            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
    </script>
</body>
</html>
