<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Dev - One Time Use</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message"></div>
            <h2>Buat Akaun Dev Pertama</h2>
            <p style="color: #dc3545; font-size: 14px; margin-bottom: 20px;">
                ⚠️ Delete file ni lepas guna! Bahaya kalau orang lain jumpa.
            </p>
            <form id="devForm">
                <div class="input-group">
                    <label>Nama Dev</label>
                    <input type="text" id="devName" placeholder="Admin" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="devEmail" placeholder="dev@email.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="devPassword" placeholder="Min 6 karakter" required>
                </div>
                <button type="submit" id="createBtn">Create Dev Account</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('devForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('createBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            const name = document.getElementById('devName').value;
            const email = document.getElementById('devEmail').value;
            const password = document.getElementById('devPassword').value;

            // 1. Signup user
            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email,
                password,
                options: { data: { full_name: name } }
            });

            if (authError) {
                showMessage(authError.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Dev Account';
                return;
            }

            // 2. Update jadi dev + approved
            const { error: updateError } = await supabaseClient
             .from('profiles')
             .update({ role: 'dev', status: 'approved' })
             .eq('id', authData.user.id);

            if (updateError) {
                showMessage('User created tapi gagal update role: ' + updateError.message, 'error');
            } else {
                showMessage('✅ Dev account berjaya! Email: ' + email + ' | Dah boleh login', 'success');
                document.getElementById('devForm').reset();
            }

            btn.disabled = false;
            btn.textContent = 'Create Dev Account';
        });
    </script>
</body>
</html>
