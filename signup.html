<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message"></div>
            <h2>Daftar Akaun</h2>
            <form id="signupForm">
                <div class="input-group">
                    <label>Nama</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" minlength="6" required>
                </div>
                <button type="submit" id="signupBtn">Daftar</button>
            </form>
            <div class="link-text">
                Dah ada akaun? <a href="/login">Login di sini</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    options: { data: { full_name: document.getElementById('name').value } }
                });

                if (error) throw error;

                showMessage('Daftar berjaya! Tunggu admin approve.', 'success');
                setTimeout(() => window.location.replace('/login'), 2000);
            } catch (err) {
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Daftar';
            }
        });
    </script>
</body>
</html>
