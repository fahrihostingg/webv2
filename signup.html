<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message"></div>
            <h2>Daftar Akaun Baru</h2>
            <form id="signupForm">
                <div class="input-group">
                    <label>Nama Penuh</label>
                    <input type="text" id="name" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="btn">Daftar</button>
            </form>
            <div class="link-text">
                Sudah ada akaun? <a href="/login">Login di sini</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.textContent = 'Daftar...';

            const { data, error } = await supabaseClient.auth.signUp({
                email: email.value,
                password: password.value,
                options: { data: { full_name: name.value } }
            });

            if (error) {
                showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Daftar';
            } else {
                showMessage('Daftar berjaya! Tunggu admin approve.', 'success');
                setTimeout(() => window.location.replace('/login'), 1500);
            }
        });
    </script>
</body>
</html>
