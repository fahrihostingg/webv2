<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Pahri Platform v1.6.2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 32px; margin: 0;">⚡ Pahri</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.7; font-size: 12px;">Platform v1.6.2</p>
            </div>

            <h2 style="font-size: 20px;">Daftar Akaun</h2>
            <p style="font-size: 13px;">Buat akaun baru - tunggu admin approve</p>

            <div id="message" class="message" style="display:none;"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Nama Penuh" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min 6 character" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Ulang password" required autocomplete="new-password">
                </div>

                <button type="submit" class="btn-primary" id="signupBtn">
                    <span id="btnText">Daftar Sekarang</span>
                    <span id="btnLoading" style="display:none;">⏳ Loading...</span>
                </button>
            </form>

            <div class="auth-link">
                Dah ada akaun? <a href="/login">Login sini</a>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.6.2
    </div>

    <div id="toastContainer"></div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const signupBtn = document.getElementById('signupBtn');

            if (password!== confirmPassword) {
                showMessage('Password tak sama!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password min 6 character!', 'error');
                return;
            }

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            signupBtn.disabled = true;

            const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: fullName
                    }
                }
            });

            if (authError) {
                showMessage('Error: ' + authError.message, 'error');
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                signupBtn.disabled = false;
                return;
            }

            showToast('✅ Daftar berjaya! Tunggu admin approve.', 'success');
            setTimeout(() => window.location.replace('/login'), 2000);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
