<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AmmarBN Platform v1.3.1</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 25px;">
                <h1 style="font-size: 28px; margin: 0;">⚡ AmmarBN</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.7; font-size: 13px;">Platform v1.3.1 Pro</p>
            </div>

            <h2 style="font-size: 22px; margin-bottom: 8px;">Daftar Akaun Baru</h2>
            <p style="font-size: 14px; margin-bottom: 25px;">Akaun perlu approval admin sebelum boleh login</p>

            <div id="message" class="message" style="display:none;"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label>Nama Penuh</label>
                    <input type="text" id="fullName" placeholder="Ahmad Bin Ali" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="ahmad@app.local" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Min 6 karakter" required minlength="6">
                    <small style="color: #999; font-size: 12px;">Min 6 karakter</small>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Taip password sekali lagi" required>
                </div>
                <button type="submit" class="btn-primary" id="signupBtn">
                    <span id="btnText">Daftar Sekarang</span>
                    <span id="btnLoading" style="display:none;">⏳ Loading...</span>
                </button>
            </form>

            <div class="auth-link">
                Dah ada akaun? <a href="/login">Login sini</a>
            </div>

            <div style="margin-top: 25px; padding: 12px; background: #fff3cd; border-radius: 8px; border-left: 4px solid #ffc107;">
                <p style="font-size: 12px; color: #856404; margin: 0;">
                    <strong>⚠️ Nota:</strong> Lepas register, status "pending". Admin kena approve dulu baru boleh login.
                </p>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.3.1
    </div>

    <div id="toastContainer"></div>

    <script>
        // Auto dark mode ikut preference
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // Check kalau dah login
        (async () => {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (user) {
                window.location.replace('/dashboard');
            }
        })();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const signupBtn = document.getElementById('signupBtn');

            if (password !== confirmPassword) {
                showMessage('Password tak sama!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password kena min 6 karakter!', 'error');
                return;
            }

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            signupBtn.disabled = true;

            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: { 
                        full_name: fullName,
                        role: 'user'
                    }
                }
            });

            if (error) {
                showMessage('Register gagal: ' + error.message, 'error');
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                signupBtn.disabled = false;
                return;
            }

            showToast('Register berjaya! Tunggu admin approve.', 'success');
            showMessage('Akaun dah create! Status: Pending. Tunggu admin approve sebelum login.', 'success');
            
            setTimeout(() => window.location.replace('/login'), 3000);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
