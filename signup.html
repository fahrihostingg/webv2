<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message"></div>
            <h2>Daftar Akaun</h2>
            <form id="signupForm">
                <div class="input-group">
                    <label>Nama</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" autocomplete="new-password" required minlength="6">
                </div>
                <button type="submit" id="signupBtn">Daftar</button>
            </form>
            <div class="link-text">
                Dah ada akaun? <a href="/login">Login di sini</a>
            </div>
        </div>
    </div>

    <script>
        (async () => {
            const { ok } = await checkAuth();
            if (ok) window.location.replace('/dashboard');
        })();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Daftar...';

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // 1. Signup user kat auth.users dulu
                const { data: signUpData, error: signUpError } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: { full_name: fullName }
                    }
                });
                
                if (signUpError) throw signUpError;
                if (!signUpData.user) throw new Error('Signup gagal');

                // 2. Manual insert ke profiles lepas signup
                const { error: profileError } = await supabaseClient
                    .from('profiles')
                    .insert({
                        id: signUpData.user.id,
                        full_name: fullName,
                        email: email,
                        role: 'user',
                        status: 'pending'
                    });

                if (profileError) {
                    console.error('Profile insert error:', profileError);
                    // Kalau profile gagal, delete user auth supaya tak tergantung
                    throw new Error('Gagal buat profile: ' + profileError.message);
                }

                showMessage('Daftar berjaya! Tunggu admin approve akaun anda.', 'success');
                setTimeout(() => window.location.replace('/login'), 3000);

            } catch (err) {
                console.error('Signup error:', err);
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Daftar';
            }
        });
    </script>
</body>
</html>
