<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message"></div>
            <h2>Selamat Datang Kembali</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password anda" required>
                </div>
                <button type="submit" id="loginBtn">Login</button>
            </form>
            <div class="link-text">
                Belum ada akaun? <a href="/signup">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script>
        // Check session + force fetch fresh profile dari DB
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: profile, error } = await supabaseClient
                    .from('profiles')
                    .select('status')
                    .eq('id', session.user.id)
                    .single();
                    
                if (error || !profile) {
                    await supabaseClient.auth.signOut();
                    return;
                }
                
                if (profile.status === 'approved') {
                    window.location.href = '/dashboard';
                } else {
                    await supabaseClient.auth.signOut();
                    showMessage('Akaun anda masih pending. Tunggu admin approve.', 'error');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', checkSession);

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Loading...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ 
                email, 
                password 
            });

            if (error) {
                showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
                return;
            }

            // WAJIB: Fetch profile fresh dari DB lepas login
            const { data: profile, error: profileError } = await supabaseClient
                .from('profiles')
                .select('status, role')
                .eq('id', data.user.id)
                .single();

            if (profileError) {
                showMessage('Gagal baca profile: ' + profileError.message, 'error');
                await supabaseClient.auth.signOut();
                btn.disabled = false;
                btn.textContent = 'Login';
                return;
            }

            if (profile.status !== 'approved') {
                showMessage('Akaun anda masih pending approval.', 'error');
                await supabaseClient.auth.signOut();
            } else {
                window.location.href = '/dashboard';
            }

            btn.disabled = false;
            btn.textContent = 'Login';
        });
    </script>
</body>
</html>
