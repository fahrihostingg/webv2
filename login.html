<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message" style="display:none;"></div>
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn">Login</button>
            </form>
            <div class="link-text">
                Belum ada akaun? <a href="/signup">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script>
        // Kalau dah login, tendang dashboard
        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.replace('/dashboard');
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Login...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                // 1. Try login
                const { data: signInData, error: signInError } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (signInError) {
                    // 2. Check kalau user wujud ke tak kat profiles
                    const { data: profileCheck } = await supabaseClient
                        .from('profiles')
                        .select('id, status')
                        .eq('email', email)
                        .maybeSingle();

                    if (!profileCheck) {
                        throw new Error('Email belum daftar. Sila signup dulu.');
                    } else if (profileCheck.status === 'pending') {
                        await supabaseClient.auth.signOut(); // logout balik
                        throw new Error('Akaun belum approve. Tunggu admin.');
                    } else if (profileCheck.status === 'rejected') {
                        await supabaseClient.auth.signOut();
                        throw new Error('Akaun kena reject. Contact admin.');
                    } else {
                        // User wujud + approved tapi password salah
                        throw new Error('Password salah. Cuba lagi.');
                    }
                }

                // 3. Login berjaya, check status profile
                const { data: profile, error: profileError } = await supabaseClient
                    .from('profiles')
                    .select('role, status')
                    .eq('id', signInData.user.id)
                    .single();

                if (profileError || !profile) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Profile tak jumpa. Contact admin.');
                }

                if (profile.status !== 'approved') {
                    await supabaseClient.auth.signOut();
                    throw new Error('Akaun belum approve. Tunggu admin.');
                }

                // 4. Semua ok, redirect ikut role
                showMessage('Login berjaya!', 'success');
                setTimeout(() => {
                    if (profile.role === 'admin' || profile.role === 'dev') {
                        window.location.replace('/admin');
                    } else {
                        window.location.replace('/dashboard');
                    }
                }, 500);

            } catch (err) {
                console.error('Login error:', err);
                let msg = err.message;
                
                if (msg.includes('Invalid login credentials')) {
                    msg = 'Email atau password salah.';
                }
                
                showMessage(msg, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
