<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmmarBN Platform v1.3.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 32px; margin: 0;">⚡ AmmarBN</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.7;">Platform v1.3.0 Pro</p>
            </div>
            
            <h2>Login Akaun</h2>
            <p>Masuk ke dashboard admin</p>

            <div id="message" class="message" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="nama@app.local" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    <span id="btnText">Login Sekarang</span>
                    <span id="btnLoading" style="display:none;">⏳ Loading...</span>
                </button>
            </form>

            <div class="auth-link">
                Belum ada akaun? <a href="/signup">Register sini</a>
            </div>

            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e8e8e8; text-align: center;">
                <p style="font-size: 12px; color: #999; margin: 0;">
                    Demo: devutama@app.local / adminutama@app.local<br>
                    Password: AmmarBN123! / AdminBN123!
                </p>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.3.0
    </div>

    <div id="toastContainer"></div>

    <script>
        // Theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const loginBtn = document.getElementById('loginBtn');

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            loginBtn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                showMessage('Login gagal: ' + error.message, 'error');
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
                return;
            }

            // Check status
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('status, role')
                .eq('id', data.user.id)
                .single();

            if (profile?.status === 'pending') {
                showMessage('Akaun masih pending. Tunggu admin approve.', 'error');
                await supabaseClient.auth.signOut();
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
                return;
            }

            if (profile?.status === 'rejected') {
                showMessage('Akaun anda telah ditolak.', 'error');
                await supabaseClient.auth.signOut();
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
                return;
            }

            showToast('Login berjaya! Redirect...', 'success');
            setTimeout(() => window.location.replace('/dashboard'), 1000);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }
