<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message"></div>
            <h2>Selamat Datang Kembali</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="btn">Login</button>
            </form>
            <div class="link-text">
                Belum ada akaun? <a href="/signup">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.textContent = 'Login...';

            // 1. Login terus, takyah check session
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email.value,
                password: password.value
            });

            if (error) {
                showMessage(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
                return;
            }

            // 2. Check status sekali je
            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('status')
                .eq('id', data.user.id)
                .maybeSingle();

            if (profile?.status === 'approved') {
                window.location.replace('/dashboard'); // replace lagi laju dari href
            } else {
                await supabaseClient.auth.signOut();
                showMessage('Akaun masih pending approval', 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
