
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pahri Platform v1.6.2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 32px; margin: 0;">⚡ Pahri</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.7; font-size: 12px;">Platform v1.6.2</p>
            </div>

            <h2 style="font-size: 20px;">Login</h2>
            <p style="font-size: 13px;">Masuk ke akaun kau</p>

            <div id="message" class="message" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Ingat saya</label>
                </div>

                <div style="text-align: right; margin-top: -10px; margin-bottom: 20px;">
                    <a href="/forgot-password" style="font-size: 13px; color: var(--primary); text-decoration: none;">
                        Lupa password?
                    </a>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    <span id="btnText">Masuk Sekarang</span>
                    <span id="btnLoading" style="display:none;">⏳ Loading...</span>
                </button>
            </form>

            <div class="auth-link">
                Belum ada akaun? <a href="/signup">Daftar sini</a>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.6.2
    </div>

    <div id="toastContainer"></div>

    <script>
        const rememberedEmail = localStorage.getItem('pahri_email');
        if (rememberedEmail) {
            document.getElementById('email').value = rememberedEmail;
            document.getElementById('rememberMe').checked = true;
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                const { data: profile } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', session.user.id)
                .single();

                if (profile) {
                    const redirectUrl = profile.role === 'admin' || profile.role === 'dev' 
                       ? '/admin' 
                        : '/dashboard';
                    window.location.replace(redirectUrl);
                }
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const loginBtn = document.getElementById('loginBtn');

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            loginBtn.disabled = true;

            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError) {
                if (authError.message.includes('Invalid login credentials')) {
                    showMessage('Email atau password salah.', 'error');
                } else if (authError.message.includes('Email not confirmed')) {
                    showMessage('Email belum confirm. Check inbox.', 'error');
                } else {
                    showMessage('Login gagal: ' + authError.message, 'error');
                }
                
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
                return;
            }

            if (rememberMe) {
                localStorage.setItem('pahri_email', email);
            } else {
                localStorage.removeItem('pahri_email');
            }

            const { data: profile, error: profileError } = await supabaseClient
            .from('profiles')
            .select('id, status, role, full_name')
            .eq('id', authData.user.id)
            .single();

            if (profileError) {
                showMessage('Error load profile. Contact admin.', 'error');
                await supabaseClient.auth.signOut();
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
                return;
            }

            if (profile.status === 'pending') {
                showMessage('⚠️ Akaun masih PENDING. Tunggu admin approve.', 'error');
                await supabaseClient.auth.signOut();
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
                return;
            }

            if (profile.status === 'rejected') {
                showMessage('❌ Akaun ditolak. Contact admin.', 'error');
                await supabaseClient.auth.signOut();
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                loginBtn.disabled = false;
                return;
            }

            await supabaseClient.from('activity_logs').insert({
                user_id: authData.user.id,
                action: 'login'
            });

            showToast(`Welcome back, ${profile.full_name || email}! 🎉`, 'success');
            
            const redirectUrl = profile.role === 'admin' || profile.role === 'dev' 
               ? '/admin' 
                : '/dashboard';
            
            setTimeout(() => window.location.replace(redirectUrl), 800);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
