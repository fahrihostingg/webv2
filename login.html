<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div id="message" class="message"></div>
            <h2>Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginBtn">Login</button>
            </form>
            <div class="link-text">
                Belum ada akaun? <a href="/signup">Daftar di sini</a>
            </div>
        </div>
    </div>

    <script>
        // Kalau dah login, skip terus
        (async () => {
            const { ok, profile } = await checkAuth();
            if (ok) {
                if (profile.role === 'dev' || profile.role === 'admin') {
                    window.location.replace('/admin');
                } else {
                    window.location.replace('/dashboard');
                }
            }
        })();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Login...';

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                if (error) throw error;

                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('status, role')
                    .eq('id', data.user.id)
                    .maybeSingle();

                if (!profile) throw new Error('Profile tak wujud');
                if (profile.status !== 'approved') {
                    await supabaseClient.auth.signOut();
                    throw new Error('Akaun masih pending');
                }

                if (profile.role === 'dev' || profile.role === 'admin') {
                    window.location.replace('/admin');
                } else {
                    window.location.replace('/dashboard');
                }
            } catch (err) {
                showMessage(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
