<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Supabase Auth</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="nav">
                <button class="secondary" onclick="window.location.href='dashboard.html'">← Kembali</button>
            </div>

            <div id="message" class="message"></div>

            <h2>Update Profile</h2>
            <form id="profileForm">
                <div class="input-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="profileName" placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" disabled>
                </div>
                <div class="input-group">
                    <label>Password Baru</label>
                    <input type="password" id="profilePassword" placeholder="Kosongkan jika tidak ganti">
                </div>
                <button type="submit" class="success">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;

        (async () => {
            currentUser = await requireAuth();
            if (!currentUser) return;

            document.getElementById('profileName').value = currentUser.user_metadata?.full_name || '';
            document.getElementById('profileEmail').value = currentUser.email;
        })();

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('profileName').value;
            const password = document.getElementById('profilePassword').value;

            const updates = { data: { full_name: fullName } };
            if (password) updates.password = password;

            const { error } = await supabaseClient.auth.updateUser(updates);

            if (error) {
                showMessage(error.message, 'error');
            } else {
                showMessage('Profile berhasil diupdate!', 'success');
                document.getElementById('profilePassword').value = '';
            }
        });
    </script>
</body>
</html>
