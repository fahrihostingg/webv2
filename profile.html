<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Pahri v1.7.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="dashboard-body">
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>👤 Profile Saya</h1>
                <p id="userWelcome">Loading...</p>
            </div>
            <div>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                    <span id="themeIcon">🌓</span> Tema
                </button>
                <button onclick="window.location.href='/dashboard'">📊 Dashboard</button>
                <button onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="card">
            <h3>✏️ Edit Profile</h3>
            <div id="message" class="message" style="display:none;"></div>
            
            <div style="text-align: center; margin-bottom: 30px;">
                <div id="avatarPreview" style="width: 120px; height: 120px; border-radius: 50%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 48px; color: white;">
                    👤
                </div>
                <input type="file" id="avatarUpload" accept="image/*" style="display:none;" onchange="previewAvatar(event)">
                <button class="btn-secondary" onclick="document.getElementById('avatarUpload').click()">
                    📷 Tukar Avatar
                </button>
            </div>

            <form id="profileForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Nama Penuh" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" disabled style="opacity: 0.6;">
                    <small style="color: var(--text-light);">Email tak boleh tukar</small>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="role" disabled style="opacity: 0.6;">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <input type="text" id="status" disabled style="opacity: 0.6;">
                </div>
                <button type="submit" class="btn-primary" id="saveBtn">
                    <span id="btnText">💾 Simpan Perubahan</span>
                    <span id="btnLoading" style="display:none;">⏳ Saving...</span>
                </button>
            </form>
        </div>

        <div class="card">
            <h3>🔐 Two-Factor Authentication</h3>
            <p style="color: var(--text-light); margin-bottom: 15px;">
                Tambah extra security untuk akaun kau
            </p>
            <div id="twoFactorStatus">
                <span class="badge badge-pending">Loading...</span>
            </div>
            <button class="btn-primary" id="toggle2FA" onclick="toggle2FA()" style="margin-top: 15px;">
                Enable 2FA
            </button>
        </div>

        <div class="card">
            <h3>🔔 Notification Settings</h3>
            <div class="checkbox-group">
                <input type="checkbox" id="emailNotif" onchange="updateNotifSettings()">
                <label for="emailNotif">Email notifications untuk login baru</label>
            </div>
        </div>

        <div class="card">
            <h3>🔐 Tukar Password</h3>
            <button class="btn-secondary" onclick="window.location.href='/forgot-password'">
                Reset Password Via Email
            </button>
        </div>

        <div class="card">
            <h3>📊 Stats Akaun</h3>
            <div class="stats">
                <div class="stat-box">
                    <h3 id="loginCount">0</h3>
                    <p>🔢 Total Login</p>
                </div>
                <div class="stat-box">
                    <h3 id="lastActive">-</h3>
                    <p>⏰ Last Active</p>
                </div>
                <div class="stat-box">
                    <h3 id="joinDate">-</h3>
                    <p>📅 Join Date</p>
                </div>
            </div>
        </div>

        <div class="card" style="border: 2px solid var(--error);">
            <h3 style="color: var(--error);">⚠️ Danger Zone</h3>
            <button class="btn-secondary" onclick="downloadMyData()" style="margin-bottom: 10px; width: 100%;">
                📥 Download My Data
            </button>
            <button onclick="deleteAccount()" style="background: var(--error); color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer;">
                🗑️ Delete Account Permanent
            </button>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.7.0
    </div>

    <div id="toastContainer"></div>

    <script>
        let currentUser = null;
        let avatarFile = null;

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
        });

        function applyTheme() {
            const theme = localStorage.getItem('theme');
            const isDark = theme === 'dark';
            
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark-mode');
                document.body.classList.remove('dark-mode');
                document.getElementById('themeIcon').textContent = '🌙';
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-mode');
            const newTheme = isDark? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme();
            showToast('Tema ditukar!', 'success');
        }

        (async () => {
            const auth = await checkAuth();
            if (!auth.ok) {
                showToast(auth.msg, 'error');
                setTimeout(() => window.location.replace(auth.redirect), 1500);
                return;
            }

            currentUser = auth.profile;
            loadProfile();
        })();

        function loadProfile() {
            document.getElementById('userWelcome').textContent = `Hi, ${currentUser.full_name || currentUser.email}`;
            document.getElementById('fullName').value = currentUser.full_name || '';
            document.getElementById('email').value = currentUser.email;
            document.getElementById('role').value = currentUser.role.toUpperCase();
            document.getElementById('status').value = currentUser.status.toUpperCase();
            document.getElementById('loginCount').textContent = currentUser.login_count || 0;
            document.getElementById('lastActive').textContent = currentUser.last_active 
          ? new Date(currentUser.last_active).toLocaleString('id-ID') 
                : 'Never';
            document.getElementById('joinDate').textContent = new Date(currentUser.created_at).toLocaleDateString('id-ID');

            if (currentUser.avatar_url) {
                document.getElementById('avatarPreview').innerHTML = `<img src="${currentUser.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                const initial = (currentUser.full_name || currentUser.email)[0].toUpperCase();
                document.getElementById('avatarPreview').textContent = initial;
            }
            
            load2FAStatus();
        }

        function load2FAStatus() {
            const enabled = currentUser.two_factor_enabled;
            document.getElementById('twoFactorStatus').innerHTML = enabled 
          ? '<span class="badge badge-approved">✅ Enabled</span>' 
                : '<span class="badge badge-pending">❌ Disabled</span>';
            document.getElementById('toggle2FA').textContent = enabled? 'Disable 2FA' : 'Enable 2FA';
            document.getElementById('emailNotif').checked = currentUser.email_notifications;
        }

        async function toggle2FA() {
            const newStatus =!currentUser.two_factor_enabled;
            const { error } = await supabaseClient
          .from('profiles')
          .update({ two_factor_enabled: newStatus })
          .eq('id', currentUser.id);

            if (error) {
                showToast('Error: ' + error.message, 'error');
            } else {
                currentUser.two_factor_enabled = newStatus;
                load2FAStatus();
                showToast(`2FA ${newStatus? 'enabled' : 'disabled'}!`, 'success');
            }
        }

        async function updateNotifSettings() {
            const enabled = document.getElementById('emailNotif').checked;
            await supabaseClient
          .from('profiles')
          .update({ email_notifications: enabled })
          .eq('id', currentUser.id);
            showToast('Settings updated!', 'success');
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 2097152) {
                showToast('File terlalu besar! Max 2MB', 'error');
                return;
            }

            avatarFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('avatarPreview').innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const saveBtn = document.getElementById('saveBtn');

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            saveBtn.disabled = true;

            let avatarUrl = currentUser.avatar_url;

            if (avatarFile) {
                const fileExt = avatarFile.name.split('.').pop();
                const fileName = `${currentUser.id}.${fileExt}`;
                
                const { error: uploadError } = await supabaseClient.storage
              .from('avatars')
              .upload(fileName, avatarFile, { upsert: true });

                if (uploadError) {
                    showMessage('Error upload avatar: ' + uploadError.message, 'error');
                    btnText.style.display = 'inline';
                    btnLoading.style.display = 'none';
                    saveBtn.disabled = false;
                    return;
                }

                const { data } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                avatarUrl = data.publicUrl;
            }

            const { error } = await supabaseClient
          .from('profiles')
          .update({ 
                    full_name: fullName,
                    avatar_url: avatarUrl,
                    updated_at: new Date().toISOString()
                })
          .eq('id', currentUser.id);

            if (error) {
                showMessage('Error: ' + error.message, 'error');
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                saveBtn.disabled = false;
                return;
            }

            await supabaseClient.from('activity_logs').insert({
                user_id: currentUser.id,
                action: 'profile_update'
            });

            showToast('✅ Profile berjaya update!', 'success');
            currentUser.full_name = fullName;
            currentUser.avatar_url = avatarUrl;
            
            btnText.style.display = 'inline';
            btnLoading.style.display = 'none';
            saveBtn.disabled = false;
        });

        async function downloadMyData() {
            const { data } = await supabaseClient
          .from('profiles')
          .select('*')
          .eq('id', currentUser.id)
          .single();
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `my_data_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            showToast('Data downloaded!', 'success');
        }

        async function deleteAccount() {
            const confirm = prompt('Type DELETE untuk confirm delete account permanent:');
            if (confirm!== 'DELETE') return;

            await supabaseClient.auth.signOut();
            await supabaseClient.from('profiles').delete().eq('id', currentUser.id);
            showToast('Account deleted. Bye!', 'info');
            setTimeout(() => window.location.replace('/login'), 2000);
        }

        async function logout() {
            await supabaseClient.from('activity_logs').insert({
                user_id: currentUser.id,
                action: 'logout'
            });
            await supabaseClient.auth.signOut();
            window.location.replace('/login');
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
