<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Control Panel</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="nav">
                <button class="secondary" onclick="window.location.replace('/dashboard')">← Kembali</button>
            </div>

            <div id="message" class="message"></div>

            <h2>Update Profile</h2>
            <form id="profileForm">
                <div class="input-group">
                    <label>Nama Lengkap</label>
                    <input type="text" id="profileName" placeholder="John Doe">
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="profileEmail" disabled>
                </div>
                <div class="input-group">
                    <label>Bio</label>
                    <textarea id="profileBio" placeholder="Ceritakan tentang diri kamu..." rows="3"></textarea>
                </div>
                <div class="input-group">
                    <label>Website</label>
                    <input type="url" id="profileWebsite" placeholder="https://website.com">
                </div>
                <div class="input-group">
                    <label>Password Baru</label>
                    <input type="password" id="profilePassword" placeholder="Kosongkan jika tidak ganti">
                </div>
                <button type="submit" class="success" id="saveBtn">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <script>
        let currentUser = null;

        (async () => {
            currentUser = await requireAuth();
            if (!currentUser) return;

            const { data: profile } = await supabaseClient
             .from('profiles')
             .select('*')
             .eq('id', currentUser.id)
             .single();

            document.getElementById('profileName').value = profile?.full_name || currentUser.user_metadata?.full_name || '';
            document.getElementById('profileEmail').value = currentUser.email;
            document.getElementById('profileBio').value = profile?.bio || '';
            document.getElementById('profileWebsite').value = profile?.website || '';

            // User tak boleh edit kalau role user
            if (currentUser.profile.role === 'user') {
                document.querySelectorAll('input, textarea').forEach(el => {
                    if (el.id !== 'profileEmail') el.disabled = true;
                });
                document.getElementById('saveBtn').style.display = 'none';
                showMessage('Anda hanya boleh view. Hubungi Admin/Dev untuk edit.', 'error');
            }
        })();

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Block user dari submit
            if (currentUser.profile.role === 'user') {
                showMessage('Anda tidak ada permission untuk edit profile', 'error');
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const fullName = document.getElementById('profileName').value;
            const bio = document.getElementById('profileBio').value;
            const website = document.getElementById('profileWebsite').value;
            const password = document.getElementById('profilePassword').value;

            // Update auth metadata
            const updates = { data: { full_name: fullName } };
            if (password) updates.password = password;

            const { error: authError } = await supabaseClient.auth.updateUser(updates);
            if (authError) {
                showMessage(authError.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Simpan Perubahan';
                return;
            }

            // Update profiles table
            const { error: profileError } = await supabaseClient
              .from('profiles')
              .update({
                    full_name: fullName,
                    bio,
                    website
                })
              .eq('id', currentUser.id);

            if (profileError) {
                showMessage(profileError.message, 'error');
            } else {
                showMessage('Profile berhasil diupdate!', 'success');
                document.getElementById('profilePassword').value = '';
            }

            btn.disabled = false;
            btn.textContent = 'Simpan Perubahan';
        });
    </script>
</body>
</html>
