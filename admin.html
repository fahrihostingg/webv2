<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body class="admin-body">
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>Admin Panel</h1>
                <p>Selamat datang, <span id="adminName">...</span>! 
                   <span class="badge" id="adminRole"></span>
                </p>
            </div>
            <div>
                <button onclick="window.location.href='/dashboard'">Dashboard</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="message" class="message" style="display:none;"></div>

        <div class="stats">
            <div class="stat-box">
                <h3 id="totalUsers">0</h3>
                <p>Total Users</p>
            </div>
            <div class="stat-box">
                <h3 id="pendingUsers">0</h3>
                <p>Pending</p>
            </div>
            <div class="stat-box">
                <h3 id="approvedUsers">0</h3>
                <p>Approved</p>
            </div>
        </div>

        <div class="card">
            <h3>Pending Approval</h3>
            <div id="pendingList">Loading...</div>
        </div>

        <div class="card">
            <h3>Semua Users</h3>
            <div id="allUsersList">Loading...</div>
        </div>
    </div>

    <script>
        let currentAdmin = null;
        let allUsers = [];

        async function init() {
            const { ok, profile, redirect, msg } = await checkAuth('admin');
            if (!ok) {
                if (msg) showMessage(msg, 'error');
                return setTimeout(() => window.location.replace(redirect), 1500);
            }

            currentAdmin = profile;
            document.getElementById('adminName').textContent = profile.full_name || profile.email;
            document.getElementById('adminRole').textContent = profile.role.toUpperCase();
            
            await loadAllData();
        }

        async function loadAllData() {
            const { data, error } = await supabaseClient.rpc('get_all_users_admin');
            
            if (error) {
                showMessage('Error: ' + error.message, 'error');
                document.getElementById('pendingList').innerHTML = '<p>Error load data</p>';
                document.getElementById('allUsersList').innerHTML = '<p>Error load data</p>';
                return;
            }

            allUsers = data || [];
            renderStats();
            renderPendingUsers();
            renderAllUsers();
        }

        function renderStats() {
            const total = allUsers.length;
            const pending = allUsers.filter(u => u.status === 'pending').length;
            const approved = allUsers.filter(u => u.status === 'approved').length;

            document.getElementById('totalUsers').textContent = total;
            document.getElementById('pendingUsers').textContent = pending;
            document.getElementById('approvedUsers').textContent = approved;
        }

        function renderPendingUsers() {
            const pending = allUsers.filter(u => u.status === 'pending');
            const list = document.getElementById('pendingList');
            
            if (!pending.length) return list.innerHTML = '<p>Tiada user pending</p>';

            list.innerHTML = pending.map(u => `
                <div class="user-card">
                    <div class="user-info">
                        <strong>${u.full_name || 'No Name'}</strong><br>
                        <small>${u.email || 'No email'} | ${u.created_at ? new Date(u.created_at).toLocaleString('ms-MY') : 'No date'}</small>
                    </div>
                    <div class="user-actions">
                        <button class="btn-approve" onclick="approveUser('${u.id}')">Approve</button>
                        <button class="btn-reject" onclick="rejectUser('${u.id}')">Reject</button>
                    </div>
                </div>
            `).join('');
        }

        function renderAllUsers() {
            const list = document.getElementById('allUsersList');
            if (!allUsers.length) return list.innerHTML = '<p>Tiada user</p>';

            list.innerHTML = allUsers.map(u => `
                <div class="user-card">
                    <div class="user-info">
                        <strong>${u.full_name || 'No Name'}</strong> 
                        <span class="badge badge-${u.role}">${u.role}</span>
                        <span class="badge badge-${u.status}">${u.status}</span><br>
                        <small>${u.email || 'No email'} | ${u.created_at ? new Date(u.created_at).toLocaleDateString('ms-MY') : 'No date'}</small>
                    </div>
                    <div class="user-actions">
                        ${u.status === 'pending' ? `<button class="btn-approve" onclick="approveUser('${u.id}')">Approve</button>` : ''}
                        <select onchange="changeRole('${u.id}', this.value)" ${u.id === currentAdmin.id ? 'disabled' : ''}>
                            <option value="user" ${u.role === 'user' ? 'selected' : ''}>User</option>
                            <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                            <option value="dev" ${u.role === 'dev' ? 'selected' : ''}>Dev</option>
                        </select>
                    </div>
                </div>
            `).join('');
        }

        async function approveUser(id) {
            const { error } = await supabaseClient.rpc('update_user_admin', {
                user_id: id,
                new_status: 'approved',
                new_role: null
            });
            if (error) return showMessage('Error: ' + error.message, 'error');
            showMessage('User approved!', 'success');
            await loadAllData();
        }

        async function rejectUser(id) {
            if (!confirm('Confirm reject user?')) return;
            const { error } = await supabaseClient.rpc('update_user_admin', {
                user_id: id,
                new_status: 'rejected',
                new_role: null
            });
            if (error) return showMessage('Error: ' + error.message, 'error');
            showMessage('User rejected', 'success');
            await loadAllData();
        }

        async function changeRole(id, role) {
            if (!role) return;
            const { error } = await supabaseClient.rpc('update_user_admin', {
                user_id: id,
                new_status: null,
                new_role: role
            });
            if (error) return showMessage('Error: ' + error.message, 'error');
            showMessage('Role updated!', 'success');
            await loadAllData();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.replace('/login');
        }

        init();
    </script>
</body>
</html>
