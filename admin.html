<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Pahri v1.6.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="supabase.js"></script>
</head>
<body class="admin-body">
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>🔧 Pahri Admin Panel</h1>
                <p id="adminWelcome">Loading...</p>
            </div>
            <div>
                <button class="theme-toggle" onclick="toggleTheme()">🌓 Tema</button>
                <button onclick="window.location.href='/dashboard'">📊 Dashboard</button>
                <button onclick="window.location.href='/profile'">👤 Profile</button>
                <button onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="stats" id="statsContainer">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <div class="card" id="pendingSection" style="border: 4px solid var(--warning); display: none;">
            <h3>⏳ Pending Approval <span id="pendingCount" class="badge badge-pending">0</span></h3>
            <p style="color: var(--text-light); margin-bottom: 20px;">User baru yang tunggu approval kau.</p>
            <div id="pendingUsersList"></div>
        </div>

        <div class="card">
            <h3>📈 User Growth Analytics - Real Data</h3>
            <canvas id="userChart" style="max-height: 300px;"></canvas>
        </div>

        <div class="card">
            <h3>📋 Activity Logs - Real Time <button class="btn-secondary" onclick="loadActivityLogs()" style="float:right;">🔄 Refresh</button></h3>
            <div style="max-height: 400px; overflow-y: auto;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead style="position: sticky; top: 0; background: var(--card-bg); z-index: 10;">
                        <tr style="border-bottom: 2px solid var(--primary);">
                            <th style="padding: 12px; text-align: left;">User</th>
                            <th style="padding: 12px; text-align: left;">Action</th>
                            <th style="padding: 12px; text-align: left;">Time</th>
                        </tr>
                    </thead>
                    <tbody id="activityLogs">
                        <tr><td colspan="3" style="text-align:center;padding:20px;color:#999;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3>🔍 Search & Filter All Users <span id="totalUsersDisplay"></span></h3>
            <div class="search-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari nama atau email..." oninput="filterUsers()">
                <select id="roleFilter" class="filter-select" onchange="filterUsers()">
                    <option value="all">Semua Role</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                    <option value="dev">Dev</option>
                </select>
                <select id="statusFilter" class="filter-select" onchange="filterUsers()">
                    <option value="all">Semua Status</option>
                    <option value="pending">⏳ Pending</option>
                    <option value="approved">✅ Approved</option>
                    <option value="rejected">❌ Rejected</option>
                </select>
                <button class="btn-export" onclick="exportUsers()">📥 Export CSV</button>
                <button class="btn-secondary" onclick="loadUsers()">🔄 Refresh</button>
            </div>

            <div class="bulk-actions" id="bulkActions">
                <span><strong id="selectedCount">0</strong> user dipilih</span>
                <div>
                    <button onclick="bulkApprove()">✅ Approve All</button>
                    <button onclick="bulkReject()">❌ Reject All</button>
                    <button onclick="bulkDelete()">🗑️ Delete All</button>
                    <button onclick="clearSelection()">✖️ Clear</button>
                </div>
            </div>

            <div id="usersList">
                <div class="skeleton skeleton-card"></div>
                <div class="skeleton skeleton-card"></div>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.6.0
    </div>

    <div id="toastContainer"></div>

    <script>
        let allUsers = [];
        let pendingUsers = [];
        let selectedUsers = new Set();
        let currentAdmin = null;
        window.userChartInstance = null;

        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode')? 'dark' : 'light');
            showToast('Tema ditukar!', 'success');
        }

        (async () => {
            const auth = await checkAuth('admin');
            if (!auth.ok) {
                showToast(auth.msg, 'error');
                setTimeout(() => window.location.replace(auth.redirect), 1500);
                return;
            }

            currentAdmin = auth.profile;
            document.getElementById('adminWelcome').textContent = `Welcome, ${currentAdmin.full_name || currentAdmin.email}`;

            await loadStats();
            await loadUsers();
            await loadActivityLogs();
        })();

        async function loadStats() {
            const { count: totalUsers } = await supabaseClient
           .from('profiles')
           .select('*', { count: 'exact', head: true });

            const { count: pendingCount } = await supabaseClient
           .from('profiles')
           .select('*', { count: 'exact', head: true })
           .eq('status', 'pending');

            const { count: adminCount } = await supabaseClient
           .from('profiles')
           .select('*', { count: 'exact', head: true })
           .eq('role', 'admin');

            const { count: approvedCount } = await supabaseClient
           .from('profiles')
           .select('*', { count: 'exact', head: true })
           .eq('status', 'approved');

            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-box">
                    <h3>${totalUsers || 0}</h3>
                    <p>👥 Total Users</p>
                </div>
                <div class="stat-box" style="border: 3px solid var(--warning);">
                    <h3>${pendingCount || 0}</h3>
                    <p>⏳ Pending Approval</p>
                </div>
                <div class="stat-box">
                    <h3>${adminCount || 0}</h3>
                    <p>👑 Admins</p>
                </div>
                <div class="stat-box">
                    <h3>${approvedCount || 0}</h3>
                    <p>✅ Approved</p>
                </div>
            `;
        }

        async function initChart() {
            const ctx = document.getElementById('userChart');
            
            const { data: users, error } = await supabaseClient
           .from('profiles')
           .select('created_at, status')
           .order('created_at', { ascending: true });

            if (error ||!users || users.length === 0) {
                ctx.parentElement.innerHTML = '<p style="text-align:center;color:#999;">Tiada data untuk chart</p>';
                return;
            }

            const months = [];
            const userCounts = [];
            const pendingCounts = [];
            const approvedCounts = [];
            
            for (let i = 5; i >= 0; i--) {
                const date = new Date();
                date.setMonth(date.getMonth() - i);
                const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                const monthLabel = date.toLocaleDateString('id-ID', { month: 'short' });
                
                months.push(monthLabel);
                
                const monthUsers = users.filter(u => {
                    const userDate = new Date(u.created_at);
                    const userMonthKey = `${userDate.getFullYear()}-${String(userDate.getMonth() + 1).padStart(2, '0')}`;
                    return userMonthKey === monthKey;
                });
                
                userCounts.push(monthUsers.length);
                pendingCounts.push(monthUsers.filter(u => u.status === 'pending').length);
                approvedCounts.push(monthUsers.filter(u => u.status === 'approved').length);
            }

            if (window.userChartInstance) {
                window.userChartInstance.destroy();
            }

            window.userChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [
                        {
                            label: 'Total Users',
                            data: userCounts,
                            backgroundColor: 'rgba(102,126,234,0.8)',
                            borderRadius: 8,
                            borderWidth: 0
                        },
                        {
                            label: 'Approved',
                            data: approvedCounts,
                            backgroundColor: 'rgba(34,197,94,0.8)',
                            borderRadius: 8,
                            borderWidth: 0
                        },
                        {
                            label: 'Pending',
                            data: pendingCounts,
                            backgroundColor: 'rgba(251,191,36,0.8)',
                            borderRadius: 8,
                            borderWidth: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { usePointStyle: true, padding: 15, font: { size: 12 } }
                        },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            padding: 12
                        }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 11 } }, grid: { color: 'rgba(0,0,0,0.05)' } },
                        x: { grid: { display: false }, ticks: { font: { size: 11 } } }
                    }
                }
            });
        }

        async function loadActivityLogs() {
            const { data: logs, error } = await supabaseClient
              .from('activity_logs')
              .select('*, profiles(full_name, email)')
              .order('created_at', { ascending: false })
              .limit(50);

            const tbody = document.getElementById('activityLogs');
            if (error ||!logs || logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;padding:20px;color:#999;">No activity yet</td></tr>';
                return;
            }

            const actionColors = {
                login: 'approved',
                logout: 'user',
                profile_update: 'dev',
                password_reset: 'pending'
            };

            tbody.innerHTML = logs.map(log => `
                <tr style="border-bottom: 1px solid #eee;">
                    <td style="padding: 12px;">
                        <strong>${log.profiles?.full_name || 'Unknown'}</strong><br>
                        <small style="color:#999;">${log.profiles?.email || ''}</small>
                    </td>
                    <td style="padding: 12px;">
                        <span class="badge badge-${actionColors[log.action] || 'user'}">
                            ${log.action.toUpperCase().replace('_', ' ')}
                        </span>
                    </td>
                    <td style="padding: 12px; font-size: 13px;">
                        ${new Date(log.created_at).toLocaleString('id-ID')}
                    </td>
                </tr>
            `).join('');
        }

        async function loadUsers() {
            const { data: users, error } = await supabaseClient
           .from('profiles')
           .select('*')
           .order('created_at', { ascending: false });

            if (error) {
                showToast('Error load users: ' + error.message, 'error');
                return;
            }

            allUsers = users || [];
            pendingUsers = allUsers.filter(u => u.status === 'pending');

            document.getElementById('totalUsersDisplay').textContent = `(Total: ${allUsers.length})`;

            if (pendingUsers.length > 0) {
                document.getElementById('pendingSection').style.display = 'block';
                document.getElementById('pendingCount').textContent = pendingUsers.length;
                renderPendingUsers();
            } else {
                document.getElementById('pendingSection').style.display = 'none';
            }

            renderUsers(allUsers);
            await initChart();
        }

        function renderPendingUsers() {
            const list = document.getElementById('pendingUsersList');
            list.innerHTML = pendingUsers.map(user => `
                <div class="user-card" style="border-color: var(--warning); background: #fffbf0;">
                    <div class="user-info">
                        <strong>${user.full_name || 'No Name'} ⚠️</strong>
                        <small>${user.email}</small>
                        <span class="badge badge-${user.role}">${user.role}</span>
                        <span class="badge badge-pending">PENDING</span>
                        <small style="display: block; margin-top: 5px; color: #999;">
                            Register: ${new Date(user.created_at).toLocaleDateString('id-ID', {
                                day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                            })}
                        </small>
                    </div>
                    <div class="user-actions">
                        <button class="btn-approve" onclick="approveUser('${user.id}')">✅ Approve</button>
                        <button class="btn-reject" onclick="rejectUser('${user.id}')">❌ Reject</button>
                    </div>
                </div>
            `).join('');
        }

        function renderUsers(users) {
            const list = document.getElementById('usersList');

            if (users.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">Tiada user dijumpai</p>';
                return;
            }

            list.innerHTML = users.map(user => {
                const isCurrentUser = user.id === currentAdmin.id;
                const isDev = user.role === 'dev';
                const lastActive = user.last_active 
                   ? new Date(user.last_active).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
                    : 'Never';
                
                return `
                <div class="user-card">
                    <input type="checkbox" class="user-checkbox"
                           value="${user.id}"
                           ${selectedUsers.has(user.id)? 'checked' : ''}
                           ${isCurrentUser || isDev? 'disabled title="Cannot select"' : ''}
                           onchange="toggleUserSelection('${user.id}')">
                    <div class="user-info">
                        <strong>${user.full_name || 'No Name'} ${isCurrentUser? '(You)' : ''}</strong>
                        <small>${user.email}</small>
                        <span class="badge badge-${user.role}">${user.role}</span>
                        <span class="badge badge-${user.status}">${user.status}</span>
                        <small style="display: block; margin-top: 3px; color: #999;">
                            Last: ${lastActive} | Login: ${user.login_count || 0}x
                        </small>
                    </div>
                    <div class="user-actions">
                        ${user.status === 'pending'? `
                            <button class="btn-approve" onclick="approveUser('${user.id}')">✅ Approve</button>
                            <button class="btn-reject" onclick="rejectUser('${user.id}')">❌ Reject</button>
                        ` : ''}
                        ${!isCurrentUser? `
                            <select onchange="changeRole('${user.id}', this.value)" ${isDev? 'disabled title="Dev role protected"' : ''}>
                                <option value="user" ${user.role === 'user'? 'selected' : ''}>User</option>
                                <option value="admin" ${user.role === 'admin'? 'selected' : ''}>Admin</option>
                                <option value="dev" ${user.role === 'dev'? 'selected' : ''}>Dev</option>
                            </select>
                        ` : '<span style="font-size:12px;color:#999;">Current User</span>'}
                        ${isDev? '<span style="font-size:12px;color:#f59e0b;">🔒 Protected</span>' : ''}
                    </div>
                </div>
            `}).join('');
        }

        function filterUsers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const roleFilter = document.getElementById('roleFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = allUsers.filter(user => {
                const matchSearch = user.email.toLowerCase().includes(search) ||
                                   (user.full_name || '').toLowerCase().includes(search);
                const matchRole = roleFilter === 'all' || user.role === roleFilter;
                const matchStatus = statusFilter === 'all' || user.status === statusFilter;
                return matchSearch && matchRole && matchStatus;
            });

            renderUsers(filtered);
        }

        function toggleUserSelection(userId) {
            if (selectedUsers.has(userId)) {
                selectedUsers.delete(userId);
            } else {
                selectedUsers.add(userId);
            }
            updateBulkActions();
        }

        function updateBulkActions() {
            const bulkActions = document.getElementById('bulkActions');
            const selectedCount = document.getElementById('selectedCount');

            if (selectedUsers.size > 0) {
                bulkActions.classList.add('active');
                selectedCount.textContent = selectedUsers.size;
            } else {
                bulkActions.classList.remove('active');
            }
        }

        function clearSelection() {
            selectedUsers.clear();
            document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = false);
            updateBulkActions();
        }

        async function approveUser(userId) {
            const { error } = await supabaseClient
           .from('profiles')
           .update({
                  status: 'approved',
                  approved_at: new Date().toISOString(),
                  approved_by: currentAdmin.id
              })
           .eq('id', userId);

            if (error) {
                showToast('Error: ' + error.message, 'error');
            } else {
                showToast('User approved! ✅', 'success');
                await loadUsers();
                await loadStats();
                await loadActivityLogs();
            }
        }

        async function rejectUser(userId) {
            if (!confirm('Reject user ni?')) return;

            const { error } = await supabaseClient
           .from('profiles')
           .update({ status: 'rejected' })
           .eq('id', userId);

            if (error) {
                showToast('Error: ' + error.message, 'error');
            } else {
                showToast('User rejected! ❌', 'success');
                await loadUsers();
                await loadStats();
                await loadActivityLogs();
            }
        }

        async function changeRole(userId, newRole) {
            const user = allUsers.find(u => u.id === userId);
            
            if (user.role === 'dev') {
                showToast('❌ Role DEV tak boleh ditukar! Protected.', 'error');
                loadUsers();
                return;
            }

            if (userId === currentAdmin.id) {
                showToast('❌ Tak boleh tukar role sendiri!', 'error');
                loadUsers();
                return;
            }

            const { error } = await supabaseClient
           .from('profiles')
           .update({ role: newRole })
           .eq('id', userId);

            if (error) {
                showToast('Error: ' + error.message, 'error');
                loadUsers();
            } else {
                showToast(`Role updated to ${newRole}! 🎭`, 'success');
                await loadUsers();
                await loadActivityLogs();
            }
        }

        async function bulkApprove() {
            if (selectedUsers.size === 0) return;
            if (!confirm(`Approve ${selectedUsers.size} users?`)) return;

            const { error } = await supabaseClient
           .from('profiles')
           .update({
                  status: 'approved',
                  approved_at: new Date().toISOString(),
                  approved_by: currentAdmin.id
              })
           .in('id', Array.from(selectedUsers));

            if (error) {
                showToast('Error: ' + error.message, 'error');
            } else {
                showToast(`${selectedUsers.size} users approved! ✅`, 'success');
                clearSelection();
                await loadUsers();
                await loadStats();
                await loadActivityLogs();
            }
        }

        async function bulkReject() {
            if (selectedUsers.size === 0) return;
            if (!confirm(`Reject ${selectedUsers.size} users?`)) return;

            const { error } = await supabaseClient
           .from('profiles')
           .update({ status: 'rejected' })
           .in('id', Array.from(selectedUsers));

            if (error) {
                showToast('Error: ' + error.message, 'error');
            } else {
                showToast(`${selectedUsers.size} users rejected! ❌`, 'success');
                clearSelection();
                await loadUsers();
                await loadStats();
                await loadActivityLogs();
            }
        }

        async function bulkDelete() {
            if (selectedUsers.size === 0) return;
            if (!confirm(`DELETE ${selectedUsers.size} users? Tak boleh undo!`)) return;

            const { error } = await supabaseClient
           .from('profiles')
           .delete()
           .in('id', Array.from(selectedUsers));

            if (error) {
                showToast('Error: ' + error.message, 'error');
            } else {
                showToast(`${selectedUsers.size} users deleted! 🗑️`, 'success');
                clearSelection();
                await loadUsers();
                await loadStats();
                await loadActivityLogs();
            }
        }

        function exportUsers() {
            const csv = [
                'Name,Email,Role,Status,Created,Last Active,Login Count',
            ...allUsers.map(u => `"${u.full_name || ''}","${u.email}","${u.role}","${u.status}","${u.created_at}","${u.last_active || ''}","${u.login_count || 0}"`)
            ].join('\n');

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pahri_users_${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            showToast('Users exported! 📥', 'success');
        }

        async function logout() {
            await supabaseClient.from('activity_logs').insert({
                user_id: currentAdmin.id,
                action: 'logout'
            });
            await supabaseClient.auth.signOut();
            showToast('Logout berjaya!', 'success');
            setTimeout(() => window.location.replace('/login'), 1000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };

            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
