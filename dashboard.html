<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>Dashboard</h1>
                <p>Selamat datang, <span id="userName">...</span>! 
                   <span class="badge" id="userRole">...</span>
                </p>
            </div>
            <div>
                <button onclick="window.location.href='/profile'" style="margin-right:10px;">Profile</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div id="adminPanel" class="card" style="display:none;">
            <h3>Panel Admin - Approve Pengguna</h3>
            <div id="pendingUsersList"></div>
        </div>

        <div class="card">
            <h3>Buat Post Baru</h3>
            <form id="postForm">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="postTitle" placeholder="Judul post" required>
                </div>
                <div class="input-group">
                    <label>Content</label>
                    <textarea id="postContent" placeholder="Isi content..." required></textarea>
                </div>
                <button type="submit">Post Sekarang</button>
            </form>
        </div>

        <div class="card">
            <h3>Semua Posts</h3>
            <div id="postsList"></div>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            currentUser = await requireAuth(); // Auto tendang kalau tak approved
            document.getElementById('userName').textContent = currentUser.full_name || 'User';
            document.getElementById('userRole').textContent = currentUser.role.toUpperCase();
            
            if (currentUser.role === 'dev' || currentUser.role === 'admin') {
                document.getElementById('adminPanel').style.display = 'block';
                loadPendingUsers();
            }
            loadPosts();
        });

        async function loadPendingUsers() {
            const { data } = await supabaseClient.from('profiles').select('id, full_name').eq('status', 'pending');
            const list = document.getElementById('pendingUsersList');
            if (!data?.length) return list.innerHTML = '<p>Tiada user pending.</p>';
            list.innerHTML = data.map(u => `
                <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                    <strong>${u.full_name || 'No Name'}</strong>
                    <button onclick="approveUser('${u.id}')">Approve</button>
                </div>
            `).join('');
        }

        async function approveUser(id) {
            await supabaseClient.from('profiles').update({ status: 'approved' }).eq('id', id);
            showMessage('User approved!', 'success');
            loadPendingUsers();
        }

        async function loadPosts() {
            const { data } = await supabaseClient.from('posts').select('*, profiles(full_name)').order('created_at', { ascending: false });
            document.getElementById('postsList').innerHTML = !data?.length ? '<p>Belum ada post.</p>' : 
                data.map(p => `<div class="post-item"><div class="post-title">${p.title}</div><div class="post-content">${p.content}</div><div class="post-meta">Oleh: ${p.profiles?.full_name || 'Unknown'}</div></div>`).join('');
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await supabaseClient.from('posts').insert([{ 
                title: postTitle.value, 
                content: postContent.value, 
                user_id: currentUser.id 
            }]);
            showMessage('Post berjaya!', 'success');
            e.target.reset();
            loadPosts();
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = '/login';
        }
    </script>
</body>
</html>
