<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>Dashboard</h1>
                <p>Selamat datang, <span id="userName">...</span>! 
                   <span class="badge" id="userRole">...</span>
                </p>
            </div>
            <div>
                <button onclick="window.location.href='/profile'" style="margin-right:10px;">Profile</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div id="adminPanel" class="card" style="display:none;">
            <h3>Panel Admin - Approve Pengguna</h3>
            <div id="pendingUsersList"></div>
        </div>

        <div class="card">
            <h3>Buat Post Baru</h3>
            <form id="postForm">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="postTitle" placeholder="Judul post" required>
                </div>
                <div class="input-group">
                    <label>Content</label>
                    <textarea id="postContent" placeholder="Isi content..." required></textarea>
                </div>
                <button type="submit" id="postBtn">Post Sekarang</button>
            </form>
        </div>

        <div class="card">
            <h3>Semua Posts</h3>
            <div id="postsList"></div>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function init() {
            const profile = await getProfile();
            
            if (!profile) {
                window.location.href = '/login';
                return;
            }

            if (profile.status !== 'approved') {
                showMessage('Akaun belum approved. Sila logout.', 'error');
                setTimeout(logout, 2000);
                return;
            }

            currentUser = profile;
            document.getElementById('userName').textContent = profile.full_name || 'User';
            document.getElementById('userRole').textContent = profile.role.toUpperCase();
            
            if (profile.role === 'dev' || profile.role === 'admin') {
                document.getElementById('adminPanel').style.display = 'block';
                loadPendingUsers();
            }
            
            loadPosts();
        }

        async function loadPendingUsers() {
            const { data } = await supabaseClient
                .from('profiles')
                .select('id, full_name, created_at')
                .eq('status', 'pending')
                .order('created_at', { ascending: true });

            const list = document.getElementById('pendingUsersList');
            if (!data || data.length === 0) {
                list.innerHTML = '<p>Tiada user pending.</p>';
                return;
            }

            list.innerHTML = data.map(user => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid #eee;">
                    <div><strong>${user.full_name || 'No Name'}</strong></div>
                    <button onclick="approveUser('${user.id}')">Approve</button>
                </div>
            `).join('');
        }

        async function approveUser(userId) {
            const { error } = await supabaseClient
                .from('profiles')
                .update({ status: 'approved' })
                .eq('id', userId);

            if (error) showMessage('Gagal: ' + error.message, 'error');
            else {
                showMessage('User approved!', 'success');
                loadPendingUsers();
            }
        }

        async function loadPosts() {
            const { data } = await supabaseClient
                .from('posts')
                .select('*, profiles(full_name)')
                .order('created_at', { ascending: false });

            const list = document.getElementById('postsList');
            if (!data || data.length === 0) {
                list.innerHTML = '<p>Belum ada post.</p>';
                return;
            }

            list.innerHTML = data.map(post => `
                <div class="post-item">
                    <div class="post-title">${post.title}</div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-meta">Oleh: ${post.profiles?.full_name || 'Unknown'}</div>
                </div>
            `).join('');
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await supabaseClient
                .from('posts')
                .insert([{ 
                    title: document.getElementById('postTitle').value, 
                    content: document.getElementById('postContent').value, 
                    user_id: currentUser.id 
                }]);

            if (error) showMessage('Gagal: ' + error.message, 'error');
            else {
                showMessage('Post berjaya!', 'success');
                document.getElementById('postForm').reset();
                loadPosts();
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = '/login';
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
