
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pro - Pahri v1.9.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <div class="dashboard">
        <!-- HEADER -->
        <div class="dashboard-header">
            <div>
                <h1>📊 Dashboard Pro <span class="badge badge-info" style="font-size:11px;">v1.9.0</span></h1>
                <p id="userWelcome" style="margin-top: 4px;">Loading...</p>
            </div>
            <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                <!-- NOTIFICATION BELL -->
                <button onclick="toggleNotifications()" style="position: relative;">
                    🔔
                    <span id="notifBadge" class="badge badge-error" style="position: absolute; top: -8px; right: -8px; display: none;">0</span>
                </button>
                
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                    <span id="themeIcon">🌓</span>
                </button>
                <button id="storeBtn" onclick="window.location.href='/store.html'">🛍️ Store</button>
                <button id="walletBtn" onclick="window.location.href='/wallet.html'">💰 Wallet</button>
                <button id="adminBtn" onclick="window.location.href='/admin.html'" style="display:none;">🔧 Admin</button>
                <button id="devBtn" onclick="window.location.href='/dev-settings.html'" style="display:none;">👑 Dev</button>
                <button onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <!-- GOD MODE BANNER - DEV ONLY -->
        <div id="godModeBanner" style="display:none;" class="god-mode-banner">
            👑 GOD MODE ACTIVATED - UNLIMITED POWER 👑
        </div>

        <!-- STATS CARDS -->
        <div class="stats" id="statsContainer">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </div>

        <!-- QUICK ACTIONS -->
        <div class="card">
            <h3>⚡ Quick Actions</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <button class="btn-primary" onclick="window.location.href='/wallet.html'">
                    <span style="font-size: 24px;">💰</span>
                    <div style="text-align: left;">
                        <strong>Top Up Saldo</strong>
                        <small style="display: block; opacity: 0.8;">Deposit instant</small>
                    </div>
                </button>
                <button class="btn-primary" onclick="window.location.href='/store.html'">
                    <span style="font-size: 24px;">🛒</span>
                    <div style="text-align: left;">
                        <strong>Buy Product</strong>
                        <small style="display: block; opacity: 0.8;">Browse store</small>
                    </div>
                </button>
                <button class="btn-secondary" onclick="showWithdrawModal()">
                    <span style="font-size: 24px;">💸</span>
                    <div style="text-align: left;">
                        <strong>Withdraw</strong>
                        <small style="display: block; opacity: 0.8;">Min Rp 50k</small>
                    </div>
                </button>
                <button class="btn-secondary" onclick="contactSupport()">
                    <span style="font-size: 24px;">💬</span>
                    <div style="text-align: left;">
                        <strong>Support</strong>
                        <small style="display: block; opacity: 0.8;">24/7 Live chat</small>
                    </div>
                </button>
            </div>
        </div>

        <!-- CHARTS ROW -->
        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 24px;">
            <div class="card">
                <h3>📈 Spending Last 7 Days</h3>
                <canvas id="spendingChart" style="max-height: 300px;"></canvas>
            </div>
            <div class="card">
                <h3>💹 Balance Breakdown</h3>
                <canvas id="balancePie" style="max-height: 300px;"></canvas>
            </div>
        </div>

        <!-- ORDERS & ACTIVITY -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3>📦 Recent Orders</h3>
                    <button class="btn-secondary" onclick="window.location.href='/orders.html'" style="padding: 8px 16px; font-size: 13px;">View All</button>
                </div>
                <div id="recentOrders" style="max-height: 400px; overflow-y: auto;"></div>
            </div>

            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h3>📋 Activity Feed</h3>
                    <button class="btn-secondary" onclick="loadActivityFeed()" style="padding: 8px 16px; font-size: 13px;">🔄 Refresh</button>
                </div>
                <div id="activityFeed" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
        </div>

        <!-- TRANSACTIONS -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3>💳 Transaction History</h3>
                <select id="filterTx" onchange="loadTransactions()" style="width: 200px;">
                    <option value="">All Types</option>
                    <option value="deposit">Deposit</option>
                    <option value="purchase">Purchase</option>
                    <option value="withdraw">Withdraw</option>
                    <option value="admin_add">Admin Add</option>
                </select>
            </div>
            <div id="transactionList" style="max-height: 500px; overflow-y: auto;"></div>
        </div>
    </div>

    <!-- NOTIFICATION PANEL -->
    <div id="notifPanel" style="display:none; position:fixed; top:80px; right:24px; width:380px; max-height:500px; background:var(--bg-card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid var(--border); z-index:9999; overflow:hidden;">
        <div style="padding:20px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">🔔 Notifications</h3>
            <button onclick="markAllRead()" style="padding:6px 12px; font-size:12px;">Mark all read</button>
        </div>
        <div id="notifList" style="max-height:400px; overflow-y:auto;"></div>
    </div>

    <!-- WITHDRAW MODAL -->
    <div id="withdrawModal" class="modal" onclick="closeWithdrawModal(event)">
        <div class="modal-content">
            <h3>💸 Withdraw Saldo</h3>
            <div class="form-group">
                <label>Amount (Rp) - Min 50,000</label>
                <input type="number" id="withdrawAmount" min="50000" placeholder="50000">
                <small style="color:var(--text-light);">Available: <span id="availableBalance">Rp 0</span></small>
            </div>
            <div class="form-group">
                <label>Bank Name</label>
                <input type="text" id="withdrawBank" placeholder="BCA / BNI / Mandiri">
            </div>
            <div class="form-group">
                <label>Account Number</label>
                <input type="text" id="withdrawAccount" placeholder="1234567890">
            </div>
            <div class="form-group">
                <label>Account Name</label>
                <input type="text" id="withdrawName" placeholder="John Doe">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 24px;">
                <button class="btn-primary" onclick="submitWithdraw()" style="flex: 1;">💸 Submit Withdraw</button>
                <button class="btn-secondary" onclick="closeWithdrawModal()" style="flex: 1;">❌ Cancel</button>
            </div>
        </div>
    </div>

    <div class="version-badge"><span class="dot"></span>v1.9.0</div>
    <div id="toastContainer"></div>

    <script>
        let currentUser = null;
        let spendingChart = null;
        let balanceChart = null;
        let notifications = [];
        let unreadCount = 0;

        (async () => {
            const auth = await requireLogin();
            if (!auth.ok) {
                window.location.replace('/login.html');
                return;
            }

            currentUser = auth.profile;
            document.getElementById('userWelcome').textContent = 
                `Welcome back, ${currentUser.full_name} ${auth.isGod? '👑' : ''}`;

            // Show god mode banner
            if (auth.isGod) {
                document.getElementById('godModeBanner').style.display = 'block';
                document.getElementById('devBtn').style.display = 'inline-block';
            }

            // Show admin button
            if (currentUser.role === 'admin' || auth.isGod) {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }

            initTheme();
            await loadAllData();
            
            // Real-time subscriptions
            subscribeToTable('transactions', () => loadAllData());
            subscribeToTable('orders', () => loadRecentOrders());
            subscribeToTable('profiles', (payload) => {
                if (payload.new.id === currentUser.id) {
                    currentUser = payload.new;
                    updateStats();
                }
            });
        })();

        async function loadAllData() {
            await Promise.all([
                updateStats(),
                loadRecentOrders(),
                loadActivityFeed(),
                loadTransactions(),
                loadCharts(),
                loadNotifications()
            ]);
        }

        async function updateStats() {
            const { data: tx } = await supabaseClient
           .from('transactions')
           .select('amount, type')
           .eq('user_id', currentUser.id);

            const totalDeposit = tx?.filter(t => t.type === 'deposit').reduce((sum, t) => sum + t.amount, 0) || 0;
            const totalSpent = tx?.filter(t => t.type === 'purchase').reduce((sum, t) => sum + Math.abs(t.amount), 0) || 0;
            const totalOrders = tx?.filter(t => t.type === 'purchase').length || 0;

            document.getElementById('statsContainer').innerHTML = `
                <div class="stat-box" style="background: linear-gradient(135deg, #10b981, #059669);">
                    <h3>${formatCurrency(currentUser.balance)}</h3>
                    <p>💰 Current Balance</p>
                </div>
                <div class="stat-box" style="background: linear-gradient(135deg, #3b82f6, #2563eb);">
                    <h3>${formatCurrency(totalDeposit)}</h3>
                    <p>📥 Total Deposit</p>
                </div>
                <div class="stat-box" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);">
                    <h3>${formatCurrency(totalSpent)}</h3>
                    <p>🛒 Total Spent</p>
                </div>
                <div class="stat-box" style="background: linear-gradient(135deg, #f59e0b, #d97706);">
                    <h3>${totalOrders}</h3>
                    <p>📦 Total Orders</p>
                </div>
            `;
        }

        async function loadCharts() {
            // Spending chart - last 7 days
            const { data: tx } = await supabaseClient
           .from('transactions')
           .select('amount, created_at')
           .eq('user_id', currentUser.id)
           .eq('type', 'purchase')
           .gte('created_at', new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString())
           .order('created_at');

            const days = [];
            const amounts = [];
            for (let i = 6; i >= 0; i--) {
                const date = new Date(Date.now() - i * 24 * 60 * 60 * 1000);
                const dayStr = date.toLocaleDateString('id-ID', { weekday: 'short' });
                days.push(dayStr);
                
                const dayAmount = tx?.filter(t => {
                    const tDate = new Date(t.created_at);
                    return tDate.toDateString() === date.toDateString();
                }).reduce((sum, t) => sum + Math.abs(t.amount), 0) || 0;
                amounts.push(dayAmount);
            }

            if (spendingChart) spendingChart.destroy();
            spendingChart = new Chart(document.getElementById('spendingChart'), {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: 'Spending',
                        data: amounts,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99,102,241,0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { callback: v => 'Rp ' + (v/1000) + 'k' } }
                    }
                }
            });

            // Balance pie
            const { data: allTx } = await supabaseClient
           .from('transactions')
           .select('type, amount')
           .eq('user_id', currentUser.id);

            const deposit = allTx?.filter(t => t.type === 'deposit').reduce((s, t) => s + t.amount, 0) || 0;
            const spent = allTx?.filter(t => t.type === 'purchase').reduce((s, t) => s + Math.abs(t.amount), 0) || 0;
            const withdraw = allTx?.filter(t => t.type === 'withdraw').reduce((s, t) => s + Math.abs(t.amount), 0) || 0;

            if (balanceChart) balanceChart.destroy();
            balanceChart = new Chart(document.getElementById('balancePie'), {
                type: 'doughnut',
                data: {
                    labels: ['Deposit', 'Spent', 'Withdraw'],
                    datasets: [{
                        data: [deposit, spent, withdraw],
                        backgroundColor: ['#10b981', '#8b5cf6', '#f59e0b']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        async function loadRecentOrders() {
            const { data } = await supabaseClient
           .from('orders')
           .select('*, products(name, price, image_url)')
           .eq('user_id', currentUser.id)
           .order('created_at', { ascending: false })
           .limit(5);

            document.getElementById('recentOrders').innerHTML = !data || data.length === 0
                ? '<p style="text-align:center;color:var(--text-muted);padding:40px;">No orders yet</p>'
                : data.map(o => `
                    <div style="display:flex; gap:12px; padding:16px; border-bottom:1px solid var(--border); align-items:center;">
                        <img src="${o.products?.image_url || 'https://via.placeholder.com/60'}" 
                             style="width:60px; height:60px; border-radius:8px; object-fit:cover;">
                        <div style="flex:1;">
                            <strong>${o.products?.name || 'Unknown'}</strong>
                            <br><small style="color:var(--text-light);">${formatDate(o.created_at)}</small>
                        </div>
                        <div style="text-align:right;">
                            <strong style="color:var(--primary);">${formatCurrency(o.total_price)}</strong>
                            <br><span class="badge badge-${o.status}">${o.status}</span>
                        </div>
                    </div>
                `).join('');
        }

        async function loadActivityFeed() {
            const { data } = await supabaseClient
           .from('activity_logs')
           .select('*')
           .eq('user_id', currentUser.id)
           .order('created_at', { ascending: false })
           .limit(10);

            document.getElementById('activityFeed').innerHTML = !data || data.length === 0
                ? '<p style="text-align:center;color:var(--text-muted);padding:40px;">No activity yet</p>'
                : data.map(a => `
                    <div style="display:flex; gap:12px; padding:12px; border-bottom:1px solid var(--border);">
                        <div style="font-size:24px;">${getActivityIcon(a.action)}</div>
                        <div style="flex:1;">
                            <strong>${a.action.replace(/_/g, ' ')}</strong>
                            <br><small style="color:var(--text-light);">${formatDate(a.created_at)}</small>
                        </div>
                    </div>
                `).join('');
        }

        function getActivityIcon(action) {
            const icons = {
                login: '🔑',
                logout: '🚪',
                purchase: '🛒',
                deposit: '💰',
                withdraw: '💸',
                update_profile: '✏️'
            };
            return icons[action] || '📋';
        }

        async function loadTransactions() {
            const filter = document.getElementById('filterTx').value;
            let query = supabaseClient
           .from('transactions')
           .select('*')
           .eq('user_id', currentUser.id)
           .order('created_at', { ascending: false })
           .limit(20);

            if (filter) query = query.eq('type', filter);

            const { data } = await query;

            document.getElementById('transactionList').innerHTML = !data || data.length === 0
                ? '<p style="text-align:center;color:var(--text-muted);padding:40px;">No transactions</p>'
                : data.map(t => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:16px; border-bottom:1px solid var(--border);">
                        <div style="display:flex; gap:12px; align-items:center;">
                            <div style="font-size:28px;">${t.amount > 0? '📥' : '📤'}</div>
                            <div>
                                <strong>${t.description}</strong>
                                <br><small style="color:var(--text-light);">${formatDate(t.created_at)}</small>
                            </div>
                        <strong style="color:${t.amount > 0? 'var(--success)' : 'var(--error)'}; font-size:16px;">
                            ${t.amount > 0? '+' : ''}${formatCurrency(t.amount)}
                        </strong>
                    </div>
                `).join('');
        }

        async function loadNotifications() {
            // Simulate notifications from orders/transactions
            const { data: orders } = await supabaseClient
           .from('orders')
           .select('*, products(name)')
           .eq('user_id', currentUser.id)
           .eq('status', 'completed')
           .order('updated_at', { ascending: false })
           .limit(5);

            notifications = orders?.map(o => ({
                id: o.id,
                title: 'Order Completed',
                message: `${o.products?.name} is ready!`,
                time: o.updated_at,
                read: false
            })) || [];

            unreadCount = notifications.filter(n =>!n.read).length;
            updateNotifBadge();
            renderNotifications();
        }

        function updateNotifBadge() {
            const badge = document.getElementById('notifBadge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = 'block';
            } else {
                badge.style.display = 'none';
            }
        }

        function renderNotifications() {
            document.getElementById('notifList').innerHTML = notifications.length === 0
                ? '<p style="text-align:center;color:var(--text-muted);padding:40px;">No notifications</p>'
                : notifications.map(n => `
                    <div style="padding:16px; border-bottom:1px solid var(--border); ${!n.read? 'background:rgba(99,102,241,0.1);' : ''}">
                        <strong>${n.title}</strong>
                        <p style="margin:4px 0; color:var(--text-light); font-size:14px;">${n.message}</p>
                        <small style="color:var(--text-muted);">${formatDate(n.time)}</small>
                    </div>
                `).join('');
        }

        function toggleNotifications() {
            const panel = document.getElementById('notifPanel');
            panel.style.display = panel.style.display === 'none'? 'block' : 'none';
        }

        function markAllRead() {
            notifications.forEach(n => n.read = true);
            unreadCount = 0;
            updateNotifBadge();
            renderNotifications();
            showToast('All notifications marked as read', 'success');
        }

        function showWithdrawModal() {
            document.getElementById('availableBalance').textContent = formatCurrency(currentUser.balance);
            document.getElementById('withdrawModal').classList.add('active');
        }

        function closeWithdrawModal(e) {
            if (e && e.target!== e.currentTarget) return;
            document.getElementById('withdrawModal').classList.remove('active');
        }

        async function submitWithdraw() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const bank = document.getElementById('withdrawBank').value;
            const account = document.getElementById('withdrawAccount').value;
            const name = document.getElementById('withdrawName').value;

            if (!amount || amount < 50000) {
                showToast('Minimum withdraw Rp 50,000', 'error');
                return;
            }

            if (amount > currentUser.balance) {
                showToast('Insufficient balance', 'error');
                return;
            }

            if (!bank ||!account ||!name) {
                showToast('Please fill all fields', 'error');
                return;
            }

            const { error } = await supabaseClient.from('withdrawals').insert({
                user_id: currentUser.id,
                amount,
                bank_name: bank,
                account_number: account,
                account_name: name,
                status: 'pending'
            });

            if (error) {
                showToast('Error: ' + error.message, 'error');
                return;
            }

            showToast('✅ Withdraw request submitted! Wait for admin approval.', 'success');
            closeWithdrawModal();
            await loadAllData();
        }

        function contactSupport() {
            window.open('https://t.me/pahri_support', '_blank');
        }

        async function logout() {
            await supabaseClient.from('activity_logs').insert({
                user_id: currentUser.id,
                action: 'logout'
            });
            await supabaseClient.auth.signOut();
            showToast('Logged out successfully', 'success');
            setTimeout(() => window.location.replace('/login.html'), 1000);
        }

        // Close notif panel when clicking outside
        document.addEventListener('click', (e) => {
            const panel = document.getElementById('notifPanel');
            const bell = e.target.closest('button');
            if (!panel.contains(e.target) &&!bell?.onclick?.toString().includes('toggleNotifications')) {
                panel.style.display = 'none';
            }
        });
    </script>
</body>
</html>
