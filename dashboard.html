<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body class="dashboard-body">
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>AmmarBN Platform</h1>
                <p>Selamat datang, <span id="userName">...</span>! 
                   <span class="badge" id="userRole"></span>
                </p>
            </div>
            <div>
                <button id="adminBtn" style="display:none;" onclick="window.location.href='/admin'">Admin Panel</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="message" class="message" style="display:none;"></div>

        <div class="welcome-card">
            <h2>Dashboard Utama</h2>
            <p>Platform siap digunakan. Akses admin untuk urus user.</p>
            <div id="pendingNotice" style="display:none;" class="message error">
                Akaun anda masih pending approval. Tunggu admin approve.
            </div>
            <button class="btn-primary" onclick="showMessage('Feature coming soon!', 'success')">Mula Projek</button>
        </div>
    </div>

    <script>
        async function initDashboard() {
            const { ok, profile, redirect, msg } = await checkAuth();
            if (!ok) {
                if (msg) showMessage(msg, 'error');
                return setTimeout(() => window.location.replace(redirect), 1500);
            }

            document.getElementById('userName').textContent = profile.full_name || profile.email;
            document.getElementById('userRole').textContent = profile.role.toUpperCase();
            
            if (['admin', 'dev'].includes(profile.role)) {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }

            if (profile.status === 'pending') {
                document.getElementById('pendingNotice').style.display = 'block';
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.replace('/login');
        }

        initDashboard();
    </script>
</body>
</html>
