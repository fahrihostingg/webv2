<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Supabase Auth</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="container wide">
        <div class="content">
            <div class="nav">
                <button class="secondary" onclick="window.location.replace('/dashboard')">Dashboard</button>
                <button class="secondary" onclick="window.location.replace('/profile')">Profile</button>
                <button class="secondary" id="adminBtn" style="display:none" onclick="loadAllPosts()">All Posts</button>
                <button class="danger" onclick="signOut()" style="margin-left: auto;">Keluar</button>
            </div>

            <div id="message" class="message"></div>

            <div style="background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px;">
                <div class="avatar" id="userAvatar" style="margin: 0; width: 60px; height: 60px; font-size: 24px;">U</div>
                <div>
                    <h3 id="welcomeText" style="margin-bottom: 4px;">Loading...</h3>
                    <div id="roleBadge" class="badge user">USER</div>
                    <p class="user-email" id="userEmail" style="margin: 0; text-align: left;"></p>
                </div>
                <div style="margin-left: auto; text-align: right;">
                    <div style="font-size: 24px; font-weight: 700; color: #667eea;" id="postCount">0</div>
                    <div style="font-size: 12px; color: #6c757d;">Total Posts</div>
                </div>
            </div>

            <div style="background: white; border: 2px solid #e9ecef; padding: 20px; border-radius: 12px; margin-bottom: 24px;">
                <h3 style="margin-bottom: 16px;">Buat Post Baru</h3>
                <form id="postForm">
                    <div class="input-group">
                        <input type="text" id="postTitle" placeholder="Judul post..." required>
                    </div>
                    <div class="input-group">
                        <textarea id="postContent" placeholder="Tulis sesuatu..." rows="3"></textarea>
                    </div>
                    <button type="submit" class="success" style="margin: 0;">Publish Post</button>
                </form>
            </div>

            <div class="input-group">
                <input type="text" id="searchPost" placeholder="🔍 Cari post..." oninput="filterPosts()">
            </div>

            <h3 style="margin-bottom: 16px;" id="postHeader">Post Kamu</h3>
            <div id="postsList"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let allPosts = [];
        let isAdminView = false;

        (async () => {
            currentUser = await requireAuth();
            if (!currentUser) return;

            const name = currentUser.user_metadata?.full_name || currentUser.email.split('@')[0];
            const role = currentUser.user_metadata?.role || 'user';

            document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
            document.getElementById('welcomeText').textContent = `Halo, ${name}!`;
            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('roleBadge').textContent = role.toUpperCase();
            document.getElementById('roleBadge').className = 'badge ' + role;

            if (role === 'admin') document.getElementById('adminBtn').style.display = 'block';

            loadPosts();
        })();

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;

            const { error } = await supabaseClient.from('posts').insert({
                user_id: currentUser.id,
                title,
                content
            });

            if (error) {
                showMessage(error.message, 'error');
            } else {
                showMessage('Post berhasil dibuat!', 'success');
                document.getElementById('postForm').reset();
                isAdminView? loadAllPosts() : loadPosts();
            }
        });

        async function loadPosts() {
            isAdminView = false;
            document.getElementById('postHeader').textContent = 'Post Kamu';
            const { data, error } = await supabaseClient
              .from('posts')
              .select('*')
              .eq('user_id', currentUser.id)
              .order('created_at', { ascending: false });

            if (error) return showMessage(error.message, 'error');

            allPosts = data;
            document.getElementById('postCount').textContent = data.length;
            renderPosts(data);
        }

        async function loadAllPosts() {
            isAdminView = true;
            document.getElementById('postHeader').textContent = 'Semua Posts (Admin)';
            const { data, error } = await supabaseClient
              .from('posts')
              .select('*, profiles(full_name)')
              .order('created_at', { ascending: false });

            if (error) return showMessage(error.message, 'error');

            allPosts = data;
            renderPosts(data, true);
        }

        function renderPosts(posts, isAdmin = false) {
            const list = document.getElementById('postsList');
            if (posts.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 40px;">Belum ada post</p>';
                return;
            }

            list.innerHTML = posts.map(post => `
                <div class="post-card">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                        <h4 style="margin: 0;">${post.title}</h4>
                        <div>
                            <button class="link-btn" onclick="editPost('${post.id}')">Edit</button>
                            <button class="link-btn" onclick="deletePost('${post.id}')" style="color: #dc3545;">Delete</button>
                        </div>
                    </div>
                    <p>${post.content || ''}</p>
                    <div class="post-meta">
                        ${new Date(post.created_at).toLocaleString('id-ID')}
                        ${isAdmin && post.profiles?.full_name? ` • ${post.profiles.full_name}` : ''}
                    </div>
                </div>
            `).join('');
        }

        function filterPosts() {
            const query = document.getElementById('searchPost').value.toLowerCase();
            const filtered = allPosts.filter(p =>
                p.title.toLowerCase().includes(query) ||
                (p.content && p.content.toLowerCase().includes(query))
            );
            renderPosts(filtered, isAdminView);
        }

        async function deletePost(id) {
            if (!confirm('Hapus post ni?')) return;
            const { error } = await supabaseClient.from('posts').delete().eq('id', id);
            if (error) showMessage(error.message, 'error');
            else {
                showMessage('Post dihapus', 'success');
                isAdminView? loadAllPosts() : loadPosts();
            }
        }

        async function editPost(id) {
            const post = allPosts.find(p => p.id === id);
            const newTitle = prompt('Judul baru:', post.title);
            if (!newTitle) return;
            const newContent = prompt('Content baru:', post.content || '');

            const { error } = await supabaseClient.from('posts')
              .update({ title: newTitle, content: newContent })
              .eq('id', id);

            if (error) showMessage(error.message, 'error');
            else {
                showMessage('Post diupdate!', 'success');
                isAdminView? loadAllPosts() : loadPosts();
            }
        }
    </script>
</body>
</html>
