<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pahri v1.6.2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="dashboard-body">
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>📊 Dashboard</h1>
                <p id="userWelcome">Loading...</p>
            </div>
            <div>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                    <span id="themeIcon">🌓</span> Tema
                </button>
                <button onclick="window.location.href='/profile'">👤 Profile</button>
                <button onclick="window.location.href='/admin'" id="adminBtn" style="display:none;">🔧 Admin</button>
                <button onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="card">
            <h3>🎉 Selamat Datang!</h3>
            <p>Akaun kau dah approved. Nikmati Pahri Platform v1.6.2</p>
            <div class="stats">
                <div class="stat-box">
                    <h3 id="loginCount">0</h3>
                    <p>🔢 Total Login</p>
                </div>
                <div class="stat-box">
                    <h3 id="lastActive">-</h3>
                    <p>⏰ Last Active</p>
                </div>
                <div class="stat-box">
                    <h3 id="joinDate">-</h3>
                    <p>📅 Join Date</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>🚀 Quick Actions</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <button class="btn-primary" onclick="window.location.href='/profile'">
                    👤 Edit Profile
                </button>
                <button class="btn-secondary" onclick="window.location.href='/forgot-password'">
                    🔑 Reset Password
                </button>
                <button class="btn-secondary" onclick="showToast('Coming soon v1.7.0!', 'info')">
                    📊 Analytics
                </button>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.6.2
    </div>

    <div id="toastContainer"></div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
        });

        function applyTheme() {
            const theme = localStorage.getItem('theme');
            const isDark = theme === 'dark';
            
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark-mode');
                document.body.classList.remove('dark-mode');
                document.getElementById('themeIcon').textContent = '🌙';
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-mode');
            const newTheme = isDark? 'light' : 'dark';
            
            localStorage.setItem('theme', newTheme);
            applyTheme();
            showToast(`Tema tukar ke ${newTheme === 'dark'? 'Gelap' : 'Terang'}!`, 'success');
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.replace('/login');
                return;
            }

            const { data: profile } = await supabaseClient
             .from('profiles')
             .select('*')
             .eq('id', session.user.id)
             .single();

            if (!profile || profile.status!== 'approved') {
                showToast('Akaun belum approved', 'error');
                setTimeout(() => window.location.replace('/login'), 1500);
                return;
            }

            currentUser = profile;
            loadDashboard();
        })();

        function loadDashboard() {
            document.getElementById('userWelcome').textContent = `Hi, ${currentUser.full_name || currentUser.email}`;
            document.getElementById('loginCount').textContent = currentUser.login_count || 0;
            document.getElementById('lastActive').textContent = currentUser.last_active 
              ? new Date(currentUser.last_active).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
                : 'Baru je';
            document.getElementById('joinDate').textContent = new Date(currentUser.created_at).toLocaleDateString('id-ID');

            if (currentUser.role === 'admin' || currentUser.role === 'dev') {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }
        }

        async function logout() {
            await supabaseClient.from('activity_logs').insert({
                user_id: currentUser.id,
                action: 'logout'
            });
            await supabaseClient.auth.signOut();
            showToast('Logout berjaya!', 'success');
            setTimeout(() => window.location.replace('/login'), 1000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };

            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
