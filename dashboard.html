<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        body { background: #f5f5f5; font-family: Arial; margin: 0; }
        .navbar { background: #6b5b95; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { margin: 0; font-size: 20px; }
        .navbar button { padding: 8px 16px; background: white; color: #6b5b95; border: none; border-radius: 4px; cursor: pointer; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .welcome { font-size: 24px; margin-bottom: 10px; }
        .badge { display: inline-block; padding: 4px 12px; background: #6b5b95; color: white; border-radius: 12px; font-size: 12px; }
        .loading { text-align: center; padding: 50px; color: #999; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>AmmarBN Platform</h1>
        <div>
            <span id="userEmail"></span>
            <button onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="loading">Loading...</div>
        
        <div id="content" style="display:none;">
            <div class="card">
                <div class="welcome">Selamat datang, <span id="userName">...</span>!</div>
                <p>Role: <span class="badge" id="userRole">...</span></p>
                <p>Status: <span class="badge" style="background:#28a745;" id="userStatus">Approved</span></p>
            </div>

            <div class="card">
                <h3>Dashboard User</h3>
                <p>Ni dashboard untuk user biasa. Letak content kau kat sini.</p>
                <p id="adminLink" style="display:none;">
                    <a href="/admin">→ Pergi ke Admin Panel</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function initDashboard() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            // Takde session = tendang login
            if (!session) {
                window.location.replace('/login');
                return;
            }

            // Check profile + status
            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('id, full_name, email, role, status')
                .eq('id', session.user.id)
                .single();

            // Takde profile atau bukan approved = logout
            if (error || !profile || profile.status !== 'approved') {
                await supabaseClient.auth.signOut();
                alert('Akaun belum approve atau kena reject.');
                window.location.replace('/login');
                return;
            }

            // Approved - load dashboard
            currentUser = profile;
            document.getElementById('userName').textContent = profile.full_name || profile.email;
            document.getElementById('userEmail').textContent = profile.email;
            document.getElementById('userRole').textContent = profile.role.toUpperCase();
            
            // Kalau admin/dev, tunjuk link ke admin panel
            if (profile.role === 'admin' || profile.role === 'dev') {
                document.getElementById('adminLink').style.display = 'block';
            }

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.replace('/login');
        }

        initDashboard();
    </script>
</body>
</html>
