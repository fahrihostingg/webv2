<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AmmarBN Platform</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>Dashboard</h1>
                <p>Selamat datang, <span id="userName">...</span>! 
                   <span class="badge" id="userRole"></span>
                </p>
            </div>
            <div>
                <button onclick="window.location.href='/profile'">Profile</button>
                <button onclick="window.location.href='/admin'" id="adminBtn" style="display:none;margin-right:10px;">Admin</button>
                <button onclick="logout()">Logout</button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div id="adminPanel" class="card" style="display:none;">
            <h3>Panel Admin - Approve Pengguna</h3>
            <div id="pendingList"></div>
        </div>

        <div class="card">
            <h3>Buat Post Baru</h3>
            <form id="postForm">
                <div class="input-group">
                    <label>Title</label>
                    <input type="text" id="postTitle" required>
                </div>
                <div class="input-group">
                    <label>Content</label>
                    <textarea id="postContent" required></textarea>
                </div>
                <button type="submit">Post</button>
            </form>
        </div>

        <div class="card">
            <h3>Semua Posts</h3>
            <div id="postsList">Loading...</div>
        </div>
    </div>

    <script>
        let currentUser = null;

        async function init() {
            const { ok, profile, redirect } = await checkAuth();
            if (!ok) return window.location.replace(redirect);

            currentUser = profile;
            document.getElementById('userName').textContent = profile.full_name || 'User';
            document.getElementById('userRole').textContent = profile.role.toUpperCase();
            
            if (profile.role === 'dev' || profile.role === 'admin') {
                document.getElementById('adminBtn').style.display = 'inline-block';
                document.getElementById('adminPanel').style.display = 'block';
                loadPending();
            }
            loadPosts();
        }

        async function loadPending() {
            const { data } = await supabaseClient.from('profiles').select('id, full_name').eq('status', 'pending');
            const list = document.getElementById('pendingList');
            if (!list) return;
            list.innerHTML = !data?.length ? '<p>Tiada pending</p>' : 
                data.map(u => `<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee">
                    <span>${u.full_name}</span>
                    <button onclick="approve('${u.id}')">Approve</button>
                </div>`).join('');
        }

        async function approve(id) {
            await supabaseClient.from('profiles').update({ status: 'approved' }).eq('id', id);
            showMessage('Approved!', 'success');
            loadPending();
        }

        async function loadPosts() {
            const { data } = await supabaseClient.from('posts').select('*, profiles(full_name)').order('created_at', { ascending: false });
            document.getElementById('postsList').innerHTML = !data?.length ? '<p>Tiada post</p>' : 
                data.map(p => `<div class="post-item"><div class="post-title">${p.title}</div><div class="post-content">${p.content}</div><div class="post-meta">Oleh: ${p.profiles?.full_name || 'Unknown'}</div></div>`).join('');
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await supabaseClient.from('posts').insert([{ 
                title: document.getElementById('postTitle').value, 
                content: document.getElementById('postContent').value, 
                user_id: currentUser.id 
            }]);
            showMessage('Posted!', 'success');
            e.target.reset();
            loadPosts();
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.replace('/login');
        }

        init();
    </script>
</body>
</html>
