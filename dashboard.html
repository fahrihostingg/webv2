
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pahri v1.7.2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="dashboard-body">
    <div class="dashboard">
        <div class="dashboard-header">
            <div>
                <h1>📊 Dashboard <span class="badge badge-info" style="font-size:12px;">v1.7.2</span></h1>
                <p id="userWelcome">Loading...</p>
            </div>
            <div>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
                    <span id="themeIcon">🌓</span> Tema
                </button>
                <button onclick="window.location.href='/profile'">👤 Profile</button>
                <button onclick="window.location.href='/admin'" id="adminBtn" style="display:none;">🔧 Admin</button>
                <button onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div id="announcementCard" class="card" style="display:none; border-left: 4px solid var(--info);">
            <h3>📢 Announcement</h3>
            <p id="announcementText"></p>
        </div>

        <div class="card">
            <h3>🎉 Selamat Datang!</h3>
            <p>Akaun kau dah approved. Nikmati Pahri Platform v1.7.2</p>
            <div class="stats">
                <div class="stat-box">
                    <h3 id="loginCount">0</h3>
                    <p>🔢 Total Login</p>
                </div>
                <div class="stat-box">
                    <h3 id="lastActive">-</h3>
                    <p>⏰ Last Active</p>
                </div>
                <div class="stat-box">
                    <h3 id="joinDate">-</h3>
                    <p>📅 Join Date</p>
                </div>
                <div class="stat-box">
                    <h3 id="notifCount">0</h3>
                    <p>🔔 Notifications</p>
                </div>
            </div>
        </div>

        <div class="card">
            <h3>🔔 Notifications <button class="btn-secondary" onclick="markAllRead()" style="float:right;font-size:12px;">Mark All Read</button></h3>
            <div id="notifList" style="max-height: 300px; overflow-y: auto;">
                <p style="text-align:center;color:#999;">Loading...</p>
            </div>
        </div>

        <div class="card">
            <h3>🚀 Quick Actions</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <button class="btn-primary" onclick="window.location.href='/profile'">
                    👤 Edit Profile
                </button>
                <button class="btn-secondary" onclick="window.location.href='/forgot-password'">
                    🔑 Reset Password
                </button>
                <button class="btn-secondary" onclick="showToast('Coming soon v1.8.0!', 'info')">
                    📊 Analytics
                </button>
            </div>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.7.2
    </div>

    <div id="toastContainer"></div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', () => {
            applyTheme();
        });

        function applyTheme() {
            const theme = localStorage.getItem('theme');
            const isDark = theme === 'dark';
            
            if (isDark) {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
                document.getElementById('themeIcon').textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark-mode');
                document.body.classList.remove('dark-mode');
                document.getElementById('themeIcon').textContent = '🌙';
            }
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains('dark-mode');
            const newTheme = isDark? 'light' : 'dark';
            
            localStorage.setItem('theme', newTheme);
            applyTheme();
            showToast(`Tema tukar ke ${newTheme === 'dark'? 'Gelap' : 'Terang'}!`, 'success');
        }

        (async () => {
            const auth = await checkAuth();
            if (!auth.ok) {
                showToast(auth.msg, 'error');
                setTimeout(() => window.location.replace(auth.redirect), 1500);
                return;
            }

            currentUser = auth.profile;
            loadDashboard();
            loadAnnouncement();
            loadNotifications();
        })();

        async function loadAnnouncement() {
            const { data } = await supabaseClient.from('system_settings').select('announcement').eq('id', 1).single();
            if (data && data.announcement) {
                document.getElementById('announcementCard').style.display = 'block';
                document.getElementById('announcementText').textContent = data.announcement;
            }
        }

        async function loadNotifications() {
            const { data } = await supabaseClient
         .from('notifications')
         .select('*')
         .eq('user_id', currentUser.id)
         .order('created_at', { ascending: false })
         .limit(10);

            const notifList = document.getElementById('notifList');
            const unread = data? data.filter(n =>!n.is_read).length : 0;
            document.getElementById('notifCount').textContent = unread;

            if (!data || data.length === 0) {
                notifList.innerHTML = '<p style="text-align:center;color:#999;">No notifications</p>';
                return;
            }

            notifList.innerHTML = data.map(n => `
                <div style="padding: 12px; border-bottom: 1px solid var(--border); ${n.is_read? 'opacity: 0.6;' : 'background: var(--bg);'}">
                    <div style="display:flex;justify-content:space-between;align-items:start;">
                        <div style="flex:1;">
                            <strong style="font-size:14px;">${n.title}</strong>
                            <p style="margin:4px 0;font-size:13px;color:var(--text-light);">${n.message}</p>
                            <small style="color:var(--text-muted);font-size:11px;">${new Date(n.created_at).toLocaleString('id-ID')}</small>
                        </div>
                        ${!n.is_read? `<button onclick="markRead('${n.id}')" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:12px;">Mark Read</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function markRead(notifId) {
            await supabaseClient.from('notifications').update({ is_read: true }).eq('id', notifId);
            loadNotifications();
        }

        async function markAllRead() {
            await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', currentUser.id);
            loadNotifications();
            showToast('All marked as read!', 'success');
        }

        function loadDashboard() {
            document.getElementById('userWelcome').textContent = `Hi, ${currentUser.full_name || currentUser.email}`;
            document.getElementById('loginCount').textContent = currentUser.login_count || 0;
            document.getElementById('lastActive').textContent = currentUser.last_active 
           ? new Date(currentUser.last_active).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
                : 'Baru je';
            document.getElementById('joinDate').textContent = new Date(currentUser.created_at).toLocaleDateString('id-ID');

            if (currentUser.role === 'admin' || currentUser.role === 'dev') {
                document.getElementById('adminBtn').style.display = 'inline-block';
            }
        }

        async function logout() {
            await supabaseClient.from('activity_logs').insert({
                user_id: currentUser.id,
                action: 'logout'
            });
            await supabaseClient.auth.signOut();
            showToast('Logout berjaya!', 'success');
            setTimeout(() => window.location.replace('/login'), 1000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };

            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
