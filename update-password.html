<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Pahri v1.6.2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 30px;">
                <h1 style="font-size: 32px; margin: 0;">⚡ Pahri</h1>
                <p style="margin: 5px 0 0 0; opacity: 0.7; font-size: 12px;">Platform v1.6.2</p>
            </div>

            <h2 style="font-size: 20px;">Update Password</h2>
            <p style="font-size: 13px;">Masukkan password baru</p>

            <div id="message" class="message" style="display:none;"></div>

            <form id="updateForm">
                <div class="form-group">
                    <label>Password Baru</label>
                    <input type="password" id="password" placeholder="Min 6 character" required>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Ulang password" required>
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span id="btnText">Update Password</span>
                    <span id="btnLoading" style="display:none;">⏳ Loading...</span>
                </button>
            </form>
        </div>
    </div>

    <div class="version-badge">
        <span class="dot"></span>v1.6.2
    </div>

    <div id="toastContainer"></div>

    <script>
        (async () => {
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (error ||!session) {
                showMessage('❌ Link tak valid atau expired. Request link baru.', 'error');
                setTimeout(() => window.location.replace('/forgot-password'), 3000);
            }
        })();

        document.getElementById('updateForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btnText = document.getElementById('btnText');
            const btnLoading = document.getElementById('btnLoading');
            const submitBtn = document.getElementById('submitBtn');

            if (password!== confirmPassword) {
                showMessage('Password tak sama!', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password min 6 character!', 'error');
                return;
            }

            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            submitBtn.disabled = true;

            const { error } = await supabaseClient.auth.updateUser({
                password: password
            });

            if (error) {
                showMessage('Error: ' + error.message, 'error');
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                submitBtn.disabled = false;
                return;
            }

            showToast('✅ Password berjaya update!', 'success');
            setTimeout(() => window.location.replace('/login'), 2000);
        });

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 5000);
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon">${icons[type]}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
